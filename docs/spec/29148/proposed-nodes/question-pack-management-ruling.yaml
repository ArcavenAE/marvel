id: question-pack-management-ruling
type: question
confidence: frontier
title: "Does the ruling against a standalone pack manager (C-017) still hold after ADR-008's phasing across sideshow and marvel?"
content: |
  Does C-017 still hold? The brief records a ruling that pack management is
  not built as a separate tool outside marvel. marvel's CLAUDE.md (lines
  512-514 at 8029b3ca) says pack management is phased across sideshow and
  marvel under ADR-008, with sideshow installing packs now and marvel
  consuming what is on the host filesystem. That is the reopener the graveyard
  node names. The StRS carries no pack-management row until the operator rules
  whether C-017 reopens.
