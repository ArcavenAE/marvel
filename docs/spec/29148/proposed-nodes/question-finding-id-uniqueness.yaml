title: "Should marvel's finding ids be made unique?"
content: |
  Two findings share the id finding-039 (the b69n contract-lane harvest, and
  the tap push race), so a citation of finding-039 cannot say which is meant
  (Q-007). The operator says it is not the only conflict and a fix or renumber
  is in progress. Rows that need finding-039 cannot cite it until the ids are
  unique.
