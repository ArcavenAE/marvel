id: question-private-claude-config-beyond-macos
type: question
confidence: frontier
title: "Does the ruling against a private claude config directory per seat hold on Linux or in a container?"
content: |
  The operator's verdict widens the ruling beyond macOS, but the graveyard
  node is macOS-only and finding-063 says the Linux or container case is open
  and needs its own run (Q-009). STREQ-OPS-004 is measured on macOS only until
  that run is made, or the node and finding are harvested to match the
  verdict.
