title: "What state should marvel report for a finished headless run and for a run blocked at a modal dialog?"
content: |
  Finding-027's truth table shows a finished one-shot run reported as crashed
  and a blocked run reported as running. The records say what is wrong, not
  which state names should replace them, and the session-state observation
  question is still open. STREQ-010 passes on what must not be reported, not
  on what must.
