id: question-reexec-under-mise
type: question
confidence: frontier
title: "How does marvel daemon reexec start the new version when marvel is installed by mise?"
content: |
  Under mise each version lives in its own directory and reexec re-executes
  the binary at the running daemon's own path, so it restarts the old version
  (Q-010, marvel#523, tracked in marvel#592). The operator wants reexec to
  work under mise even if the architecture has to change. STREQ-OPS-005 cannot
  pass today.
