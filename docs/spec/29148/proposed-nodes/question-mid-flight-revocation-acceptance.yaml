confidence: frontier
title: "What is the acceptance for full metering and mid-flight revocation in the agentic resource matrix?"
content: |
  The brief records full metering across the matrix rows as open and mid-
  flight revocation as missing, with the M1 authority model as its
  prerequisite (C-022). STREQ-015 is measurable only for environment
  construction until the authority model and a metering measure exist.
