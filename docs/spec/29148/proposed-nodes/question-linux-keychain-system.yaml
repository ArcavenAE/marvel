title: "Which keychain system will marvel require and support on Linux?"
content: |
  The brief records that macOS and Linux are both target platforms, that the
  Linux keychain system is not yet chosen, and that it will not require a GUI
  desktop or a display server (no GNOME, KDE, X or Wayland). STREQ-OPS-003 has
  no Linux pass condition until the system is chosen.
