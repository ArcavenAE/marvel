id: question-handoff-quality-measure
type: question
confidence: frontier
title: "What measures a handoff good enough to replace a working seat?"
content: |
  Whether automatic shifts may be turned on depends on whether a handoff is
  good enough to replace a working seat (C-023), but the records carry no
  measure of good enough. STREQ-016 has no pass condition until one is given.
