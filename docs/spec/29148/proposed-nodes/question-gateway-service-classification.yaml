type: question
confidence: frontier
title: "Is Gateway the right classification for switchboard, director and the external API, and which other services belong in the set?"
content: |
  The operator says Gateway is probably not the right classification and names
  candidate services: vault (credential and secrets manager), bd/dolt (tasks),
  nats (agent bus and communications), litellm (router), PAIR (backend), and
  more (Q-008). STREQ-018 has no pass condition until the classification and
  the set are decided.
