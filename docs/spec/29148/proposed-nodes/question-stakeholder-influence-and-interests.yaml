title: "What are the influence and key interests of marvel's stakeholder groups?"
content: |
  The brief names three groups (individuals on major harnesses, individuals
  who want to work at scale, and teams) but records no influence or key
  interests for any of them (Q-003, partly answered). Rows STREQ-020 to
  STREQ-025 and section 2 cannot weight the groups until this is answered.
