id: question-objective-measures
type: question
confidence: frontier
title: "How are the objectives of stable services, chosen by other users and an improved new-user experience measured?"
content: |
  The brief gives objectives with dates (C-040 two months, C-041 four months,
  C-044 six months) but no measure for stable, for other users having chosen
  marvel, or for an improved new-user experience. STREQ-020, STREQ-021 and
  STREQ-023 have no pass condition until each has a measure and an instrument.
