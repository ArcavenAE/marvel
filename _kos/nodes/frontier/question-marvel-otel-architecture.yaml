id: question-marvel-otel-architecture
type: question
confidence: frontier
title: "How does marvel manage OTEL collection: what does it advertise, host, forward, and subscribe to?"
tags:
  - marvel
  - observability
  - otel
  - telemetry
  - composability
content: |
  finding-008 established that three target harnesses emit native OTEL
  (Claude Code live-verified, Codex, Gemini CLI) and that none of them
  exports context-window occupancy. (Corrected 2026-08-09: none exports
  an occupancy GAUGE, which is the claim that holds. Codex does export
  its context-window DENOMINATOR, as `context_window` and
  `auto_compact_token_limit` attributes on `codex.conversation_starts`.
  See the corrections block below.) That answers what is available. It
  does not answer what marvel should DO with it, which is a design
  question with a composability trap on both sides: do too little and
  marvel cannot use telemetry for its own control decisions; do too
  much and marvel becomes an observability vendor.

  Operator framing (2026-08-01): marvel should know about OTEL and
  advertise OTEL services in some way to the workloads (harnesses) it
  manages, possibly stand up a full or light proxy service, and pipe or
  direct telemetry to one or more OTEL remotes. Marvel should probably
  subscribe to PORTIONS of the feed so it can perform its duty
  efficiently, without handling every interrupt and streamed event. The
  project should be composable, should work well with other
  infrastructure, and should avoid being a kitchen-sink application.
  All of this requires study before implementation.

  Two facts verified 2026-08-01 that constrain the design:

  - `internal/otel` is a 35-line stub: a stdout meter provider and a
    `marvel.agent.context_window_percent` gauge. Nothing in the daemon
    populates it or imports the package; its only importer in the tree
    is `cmd/simulator`, which records simulated engine values into the
    gauge through `engine.OnRecord` (re-verified 2026-08-09; the
    earlier "nothing populates" was true of the daemon, not of the
    tree). Marvel is an OTEL producer with no ingest path. Nothing is
    entrenched.
  - The events ring (`internal/events`) is append-only with NO
    subscribe or fan-out seam; it is polled by `marvel events`. So
    "marvel subscribes to portions of the feed" requires a seam that
    does not exist yet.

  ## Sub-questions

  **A. Topology.** What role does marvel play in the telemetry path?
  Five candidate shapes: (a) advertiser only, (b) advertiser plus
  selective subscriber against an operator-provided collector, (c)
  embedded lightweight receiver in the daemon, (d) marvel supervises a
  real otelcol sidecar (note marvel already supervises processes; that
  is the product), (e) marvel ships its own collector distribution.
  Prior to be confirmed or disconfirmed: (e) is the kitchen-sink trap
  and should be graveyarded with reasoning; the live contest is (b)
  versus (d), with (c) as the zero-external-infrastructure fallback
  that the independence rule (B2) argues for. Study: `aae-orc-fkvv`.

  **B. Subscription scope.** Which signals does the control loop
  actually need (reconciliation, health and readiness, crash-loop and
  restart decisions, shift readiness, context pressure), at what rate
  and aggregation, versus what is merely interesting? Everything
  outside that allowlist should pass through to operator remotes
  without marvel materializing it. Study: `aae-orc-24oy`.

  **C. Ring versus parallel.** Does harness OTEL feed the existing
  events ring (one internal vocabulary, one consumer path) or run as a
  parallel channel? Two competing internal telemetry paths is the
  failure mode to avoid. If the ring wins, it needs a subscription seam
  and a judgement about whether a bounded in-memory ring suits
  control-loop consumption. Study: `aae-orc-24oy`.

  **D. Non-goals.** What will marvel NOT do: storage, retention, query,
  dashboards, alerting, rollups, becoming or replacing a vendor
  backend, shipping a marvel-branded collector. Anything marvel keeps
  must be defensible as inseparable from orchestration. This is the
  kitchen-sink test made explicit, and the part most at risk of
  erosion, because each "could marvel also just..." arrives reasonably
  and one at a time. Study: `aae-orc-tpda`; ADR: `aae-orc-4eoy`.

  **E. Advertisement.** How does each harness learn the endpoint?
  Claude Code honors env vars (live-verified); Codex reads user-level
  config and ignores project config, which may block per-session
  routing entirely (`aae-orc-rjru` is the load-bearing unknown);
  Gemini uses flags or settings; opencode and Crush need a documented
  no-op path. Cross-cutting: advertising a telemetry endpoint to a
  workload looks like an instance of the service-directory surface the
  Lens-2 directive asks for (`aae-orc::question-agent-service-directory`),
  not a separate feature. Getting this wrong grows two mechanisms that
  do the same thing. Task: `aae-orc-1n6b`.

  **F. Fan-out to remotes.** The operator owns one or more remotes. Who
  holds that configuration, and is it a manifest resource (the Policy
  resource from PR #84 is the precedent for projecting config into a
  supervised workload and re-projecting it live) or daemon
  configuration? Covered by the sidecar spike `aae-orc-h6ck` and the
  brief.

  **G. Cardinality and cost.** Per-session attribution rests on
  high-cardinality attributes (`session.id`, plus marvel's own
  agent/workspace/team/role). A fleet of short-lived churning sessions
  is close to the worst case for a metrics pipeline. Does per-session
  attribution survive at fleet scale, or must it trade down to
  per-role aggregation? Probe: `aae-orc-dbfc`.

  **H. Degradation and sovereignty.** Per B2 and SOUL section 2, marvel
  must work with no collector, no remote, and no OTEL-capable harness.
  Per SOUL sections 1 and 3, the operator owns the remotes and the
  data, telemetry must not become an exfiltration path, prompt content
  stays out by default, and marvel routes no credentials. Study:
  `aae-orc-tpda`.

  ## Resolution path

  Three studies (`fkvv`, `24oy`, `tpda`) and three probes (`5ed6`
  embedded receiver, `h6ck` supervised sidecar, `dbfc` cardinality)
  plus the advertisement task (`1n6b`) feed one decision brief
  (`aae-orc-mqgf`) in the shape that worked for `aae-orc-kxce`. On
  ratification: harvest to nodes, write the ADR (`4eoy`), and unblock
  the implementation ticket (`aae-orc-jcle`, re-scoped away from
  presuming a receiver) with the chosen shape fixed.

  Consumers waiting on this: `aae-orc-w5su` (context pressure can be
  fed from OTEL instead of, or alongside, the stream) and
  `aae-orc-dc1j` (native OTEL is the first clean path for
  interactive/TUI context pressure, since OTEL is emitted regardless of
  UI mode).

  BOTH OF THOSE CONSUMER CLAIMS ARE RETIRED, 2026-08-08. OTEL cannot
  serve context pressure, and the reason is a type mismatch rather than
  a defect in the channel.

  Every harness token instrument that exists is a MONOTONIC CUMULATIVE
  COUNTER. Verbatim from the Claude Code binary:
  `tokenCounter=t("claude_code.token.usage",{description:"Number of
  tokens used",unit:"tokens"})`. Occupancy is a per-request LEVEL that
  RESETS at compaction. A counter cannot express a quantity that goes
  down, so no amount of collector work recovers occupancy from it. This
  is the same class of defect finding-007 measured when a cumulative
  total was read as a level.

  THE RULING IS NARROW AND MUST BE READ THAT WAY. OTEL is ruled out for
  ONE quantity: the occupancy numerator and the window denominator
  behind CTX% and the shift trigger. It is NOT ruled out for marvel,
  and reading it broadly would deny functionality the agentic resource
  matrix needs.

  READ AFFIRMATIVELY, the same enumeration is an INVENTORY of
  resource-matrix instruments, because the disqualifier for occupancy
  is a QUALIFIER everywhere else: dollars spent do not reset at
  compaction, and neither do tokens billed, tools invoked, subagents
  spawned, or seconds consumed. Cumulative is the correct shape for all
  of those. Mapped in
  `probe-otel-affirmative-inventory.md`, which grades every row
  MEASURED, INFERRED, or BINARY rather than asserting a uniform
  confidence.

  The highest-value row found is not a token metric at all:
  `tool.blocked_on_user` maps to matrix row 13, HUMAN ATTENTION, which
  the vision names as a gap with no owner and calls the scarcest
  metered resource. If that counter measures what its name suggests,
  Gap 1 has an instrument nobody had noticed. Worth its own check
  before it is designed around.

  THE FIRST CONCRETE OTEL PRODUCER MARVEL MIGHT CONSUME IS NOT A HARNESS
  (`study-router-and-backend-layering.md`, aae-orc-eooi, 2026-08-08). A
  router in the path (liteLLM is the instance studied) ships an `otel`
  callback emitting GenAI-semconv spans with model, provider, token usage,
  and cost, plus an opt-in v2 mode producing one trace per request
  covering auth, guardrails, the LLM call, and DB writes. Every sub-question
  on this node is posed in terms of harnesses as the emitters. If the
  richest emitter is a piece of infrastructure the operator already runs,
  sub-question A (topology) and sub-question E (advertisement) both change
  shape, because a router does not need marvel to advertise an endpoint to
  it and is not something marvel supervises.

  This does NOT reopen the occupancy ruling above. A router's spans carry
  the same cumulative token counters, so the type mismatch stands. It bears
  on the affirmative inventory instead: the resource-matrix rows that are
  correctly cumulative (dollars, tokens billed, tools invoked, seconds) may
  be better served from one router than from N harnesses, and cost in
  particular is a quantity the router computes rather than infers.

  Carried as documentary INFERENCE, not measurement: the study could not run
  liteLLM (not installed on this host; the operator's instance was left
  untouched by direction), so every liteLLM claim is read from vendor
  documentation rather than executed. It also surfaced two cautions worth
  keeping beside any adoption decision: a router can rewrite the response
  `model` field to the client-facing alias (liteLLM issue #22709), which
  would corrupt any per-model attribution marvel derived downstream, and
  liteLLM shipped a credential-stealing supply-chain compromise in two
  releases, which is a live consideration for a component that would sit in
  the credential path.

  ## Corrections absorbed 2026-08-09 (aae-orc-e06y, aae-orc-w7bd item 1)

  Both were named by the remainder sweep and repeated by the inventory
  as debts this node had not paid. Paying them here.

  1. **Codex publishes its denominator over OTEL.**
     `codex.conversation_starts` carries `context_window`,
     `auto_compact_token_limit`, and `max_output_tokens`. The
     conclusion that OTEL cannot carry context pressure still stands,
     and the REASON changes: it is instrument TYPE (the numerator is a
     cumulative counter) rather than field absence. Anyone re-checking
     this later needs the distinction, because "the field is missing"
     invites a fix that "the type is wrong" does not. Two cautions
     ride with it: the codex catalog and the wire disagree on the
     denominator (two terms in the catalog, one on the wire), and the
     codex default metric dimensions carry no `conversation.id`, so
     the logs are attributable per conversation and the metrics are
     not.
  2. **Crush and opencode are measured negatives.** Crush 0.67.0 links
     the otel API plus `metric/noop` and `trace/noop` only, with no
     SDK and no exporter, so it cannot export at all; its analytics
     stream is PostHog to `data.charm.land`, which is Charm's channel
     and not marvel-addressable. opencode 1.18.5 ships
     `@opentelemetry/api` and `sdk-trace` with no exporter and no
     metrics SDK (its SDK init was removed upstream in
     sst/opencode#1738), and gates emission behind the Vercel AI SDK's
     per-call `experimental_telemetry` flag with no config surface
     exposing it. Both serve zero matrix rows over OTEL. For both, the
     finding-007 stream and sqlite accountant remains the only path,
     and sub-question E's "documented no-op" is the whole of what
     advertisement can do for them.

  A register keyed by matrix row rather than by harness, carrying
  instrument TYPE and a per-row verdict on whether that type matches
  the quantity, is Part 7b of
  `probe-otel-affirmative-inventory.md`. Its headline: two rows of
  seventeen (2 spend, 5 tool access) have an instrument whose type
  matches its quantity without qualification; five are partial or
  attribution-only (1, 3, 4, 6, 14); one is unknown and is the most
  valuable (13, human attention); nine have nothing from harness OTEL.
  That is a subscription allowlist in draft form and therefore the
  other half of sub-question B, which until now had exactly one answer
  (context pressure is not among the signals, because OTEL cannot
  carry it).

  Tracked: aae-orc-e06y (the affirmative inventory), aae-orc-24oy /
  aae-orc-fkvv / aae-orc-tpda (the deferred OTEL studies, which still
  carry the superseded framing and should be updated from the
  inventory rather than from this node's older prose).
