id: question-gateway-external-api
type: question
confidence: frontier
title: "What does the external API/webhook Gateway sub-type look like?"
tags:
  - marvel
  - gateway
  - external-api
content: |
  The Gateway resource type has three sub-types:
  - **switchboard** — remote tmux access (designed, partial implementation)
  - **director** — inter-agent supervisor protocol (designed)
  - **external API/webhook** — *not designed*

  The third is mentioned in the resource model but has no design yet.

  Open sub-questions:
  - What external access patterns are needed? An API for triggering
    orchestrations from outside the marvel cluster?
  - Webhook receivers that dispatch work to running agent teams?
  - Or CLI-only access for now, deferring external API until there's
    a concrete use case?

  Cross-ref: orc F2.
