id: question-host-health-guard
type: question
confidence: frontier
title: "What should marvel watch, report and guard when a long-running host runs short of memory, and what stays outside marvel?"
tags:
  - marvel
  - host
  - health
  - memory
content: |
  On 2026-10-31 the busiest fleet host ran out of memory headroom. Most of the
  load was not marvel's, but marvel had no way to tell, and its own share (test
  trees it never cleans, helper processes it cannot see, seats it never recycles)
  made it worse. `docs/design/host-health-guard.md` (proposal, 2026-10-31, for
  review) answers with reporting and a few narrow guards, not a new controller.
  The cause of the host's file-event growth is a hypothesis in the design, not a
  finding.

  WHAT MARVEL OWNS, by the design's subject test: its own footprint (seat RSS and
  CPU, which it already samples; homes, bases and helpers it created), proving its
  own processes before it acts on them, and recycling its own seats. It does not
  own host memory, the file-event daemon, other tools' temp trees or how a harness
  polls git.

  PROPOSED: a host watch that only reports, run outside the daemon first; a
  footprint summary for marvel's own state; cleanup by pid, parent, start time and
  resolved path, never by pattern, signalling only what marvel created and
  recorded; recycling by age through the existing max-age trigger, closing two
  gaps (coverage: roles that declare no shift policy; completion: a request that
  never reaches its seat).

  SHIPPED since the proposal: the max-age advisory at apply (marvel#1167); the
  stuck max-age request event and the pending requests in `describe team`
  (marvel#1169); and the host's free-memory reading in each spawn event
  (marvel#1168), carried as text in the existing message and not as a typed field,
  with no cap, floor or gate.

  OPEN, the operator's three decisions in the design's section 8, none ruled
  here: whether a spawn floor on low memory exists (the design recommends none
  now, a reading in spawn events, and a decision after a week of readings; a floor
  would follow the admission rules, operator-declared and never refusing repair);
  age recycling for every long-running interactive role, with the bound the
  operator sets; and recovering the busiest host's file-event daemon, which is
  outside marvel.

  HARVEST 2026-11-02 (finding-marvel-exy5, marvel#1214, open). Marvel's own
  write and exec rates, measured on one host by a 60 s root capture on
  2026-11-02 and read against main f9a43400: about 8,600 synced 16 KB pwrites a
  minute to the daemon's bolt state file (about 140 MB a minute, about 200 GB
  a day) and 827 tmux client starts a minute. The code accounts for both: two
  loops that run every 2 s persist every running session on each pass, changed
  or not, and the dead-seat check runs one `list-panes` per seat per pass. By
  the subject test above these rates are marvel's own footprint. A fix is
  planned on marvel#1214; nothing is merged. The file-event growth cause stays
  unconfirmed until a fix lands and the rate is measured again. The same
  capture counted 773 git processes in 60 s, which marvel's own code does not
  explain, so that rate is not attributed to marvel.

