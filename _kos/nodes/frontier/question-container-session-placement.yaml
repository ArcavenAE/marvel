id: question-container-session-placement
type: question
confidence: frontier
title: "Can marvel launch, manage and attach to an agent session that runs inside a local container?"
tags:
  - marvel
  - runtime
  - containment
  - bus
content: |
  Can marvel launch, supervise (health, restart, shift, kill) and attach a
  tmux view to an agent session whose harness runs inside a local
  container (Docker, Podman, Apple `container`, Lima/colima), while
  keeping what a pane-hosted session has today: `capture`, `inject`,
  healthchecks, the director bus and its shim, policy projection at
  spawn, and the harness's own auth delegation?

  **Driving use case: a SOC-analyst evaluation team's analyst seats.**
  Two shapes, and they want different things from a container:

  - **Ephemeral analyst seats** (`<product>-<petname>`), 0 to 3 at a
    time, set up from nothing each run as the clean-room baseline. Each
    run: name, create a local legion repo with no remote, cast a team
    from a template with `marvel work`, run the product's SETUP.md,
    pass a positive-control query, work the dispatched alerts, hand
    off, unapply. What they need: a clean room per run that a finished
    run cannot leak into the next; tool limits (MCP `query`,
    `describe`, `sensor_health` only); no live credentials of any
    kind; network reach limited to the vendor clones and the analysts'
    supervisor. Today the clean room is a fresh directory on a shared
    host, and the tool and reach limits are harness config the agent
    runs beside, not a boundary it runs inside.
  - **Two long-term analyst seats** (`<product>-<petname>`, named once),
    possible targets. Memory persists as commits in their own legion
    repo, so they need the same limits plus an isolated workspace that
    outlives any one container.

  The container is the commodity answer to the containment half of
  that list while curtain (kernel sandbox) is design-only and
  aae-orc-10x waits on it. This question asks whether marvel can host
  one without losing its supervision surface, and where the container
  sits in the ratified kxce substrate (tmux is the terminal and
  human-view layer; a Go shim-in-pane is the supervision layer).

  **What the code says today (read at 97698a3, not run):**

  - `Adapter.Prepare` returns a command string that tmux runs through
    `sh -c` in `new-window`. `resolveCommand` returns `runtime.command`
    verbatim, so `command = "docker run --rm -it ... image claude"` is
    legal manifest text for the generic adapter AND for the claude
    adapter, which appends its own flags after the command.
  - Marvel's constructed environment (`MARVEL_*`, `DIRECTOR_AGENT_ID`,
    `NATS_URL`, `DIRECTOR_NATS_USER/PASS`, the heartbeat token) is set
    with `tmux new-window -e`, so it lands in the HOST shell in the
    pane. It stops at the container boundary unless the run command
    passes each name through (`-e NAME` with no value). Enforcement
    locus 1 is intact on the host and absent inside by default.
  - Health is pane-shaped: `remain-on-exit` plus `pane_dead` and
    `pane_dead_status`, read by `ReapDead`. Wave-1 metering reads the
    `pane_pid` process tree, which for a container is the runtime's
    CLI client, not the harness.
  - Paths marvel hands a harness are host paths: the projected
    `--settings` file, the headless stream FIFO, a private harness
    home whose credential entries are symlinks into the operator's own
    home (`SessionHomeSpec.LinkIn`), and `MARVEL_SOCKET` (a unix
    socket, which a VM-backed runtime on macOS may not carry across a
    bind mount).

  **Candidate placements:**

  (P1) container-in-pane: tmux on the host, `docker run -it` (or
       `exec -it`) as the pane command. `capture` and `inject` see the
       container's tty through the pane unchanged. Everything that is
       a host path or a host env var needs a bind mount or a
       pass-through.
  (P2) tmux-in-container: the container runs its own tmux server and
       marvel's driver reaches it. Keeps the harness and its shim in
       one namespace, but marvel's driver speaks to one tmux socket
       per cluster, so this is a second Instance implementation, the
       same seam question-managed-runtime-placement named for the
       cloud arm.

  **OPEN SUB-QUESTIONS:**

  (a) P1 against P2: what each costs `capture`, `inject`, the shim and
      the event stream. Hypothesis in the brief: P1 costs nothing to
      capture and inject, and everything else is plumbing.
  (b) Healthcheck semantics. Pane-alive and container-alive can
      disagree both ways: `docker kill` makes the client exit (pane
      dead, correct), but killing the pane may SIGHUP the client and
      leave the container running (orphan, marvel reports it gone).
      Which one does marvel trust, and who reaps the orphan?
  (c) Restart and shift when the container exits. Does a restart
      policy re-run `docker run` cleanly (name collisions under
      `--name`, `--rm` races), and does a shift's successor get a
      fresh container or the predecessor's volume?
  (d) Env and credentials against SOUL section 3 and ADR-009. The
      harness auth must stay the harness's and the operator's: no
      bearer baked into an image, no copy of a credential file into a
      container layer. Is a read-only bind mount of the operator's own
      credential file the container analogue of `LinkIn` (the operator
      keeps custody, revoked by deleting the original), or does
      crossing into a VM change the answer? For the analyst seats the
      question is narrower: they hold no live credentials by design,
      so only the model auth crosses.
  (e) **Director and NATS reach from inside the container
      (first-class, not a footnote).** This question covers the
      container-specific parts only; the fabric itself (one fleet
      address space over NATS leaf nodes, per-seat credentials,
      retention that never deletes unread mail, presence aggregated
      across clusters) is the director leaf-fabric design brief of
      2026-09-24, and this depends on it rather than restating it.
      Container-specific parts:
      - Network namespace: `NATS_URL=nats://127.0.0.1:...` means the
        container itself inside a container. Host networking, a
        published port reached through `host.docker.internal` (or the
        runtime's equivalent), or a NATS leaf node inside the
        container. Each has a different answer to "reach limited to
        the clones and the supervisor".
      - Identity injection: the bus identity is `DIRECTOR_AGENT_ID`
        plus the team credential marvel minted. It must arrive per
        launch through the environment or a mounted file, never an
        image layer, because an image outlives the session and a
        minted credential must not.
      - Presence and heartbeat from inside: the shim publishes
        presence; `ctx-forward` posts heartbeats to `MARVEL_SOCKET`,
        which needs the marvel binary and the socket inside.
      - Wake: a seat that never polls loses mail at the 24h inbox
        max_age (aae-orc-t77rr). An ephemeral seat that polls only
        between tapes is exactly that seat.
      - Lifecycle-bound durables: each shim start makes a durable
        consumer and none are reaped (aae-orc-iejcx, 183 counted). An
        ephemeral container per run multiplies that by the run count
        unless the durable's lifetime is bound to the container's.
      - Duplicate presence rows after a shim restart (aae-orc-4unyk):
        a container restart is a shim restart by construction.
  (f) Workspace mounts and git signing. Ephemeral legion repos have no
      remote, so signing may not arise for them; long-term seats commit
      memory and may. SSH agent forwarding into the container, with
      the hardware key's touch still on the operator's desk, is the
      only acceptable shape; no key material inside.
  (g) Image provenance. A clean room is only as clean as its image.
      Does the image come from a pinned, signed build (the
      sideshow-packs frozen-composition pattern), and does the
      analyst's SETUP.md belong in the image (faster, but measures the
      image) or in the run (slower, and measures the install path,
      which is what the ephemeral seat exists to measure)?
  (h) Runtime choice on macOS: Docker Desktop (licensing for
      commercial use), colima/Lima, Apple `container` (one VM per
      container). Which ones carry a unix socket bind mount, an SSH
      agent socket, and host networking, since (d), (e) and (f) turn
      on those three.

  NOT A COMMITMENT TO BUILD. The probe (brief-container-session-
  placement) answers whether P1 works with no marvel code change and
  names what needs one. Whether marvel grows a container field on
  Runtime is decided after.
