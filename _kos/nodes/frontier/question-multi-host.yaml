id: question-multi-host
type: question
confidence: frontier
title: "Multi-Host Scheduling via Switchboard"
content: |
  Marvel's resource model includes Host (node equivalent) for multi-host
  scheduling via switchboard. This is the distributed case — scheduling
  agent sessions across multiple machines.

  Questions: what's the scheduling algorithm? How does marvel discover
  remote hosts — manual registration, switchboard enumeration, or
  auto-discovery? Is switchboard sufficient as the transport, or does
  marvel need its own discovery mechanism? What happens when a remote
  host becomes unreachable — drain, reschedule, or wait? How does
  volume management (worktrees, shared dirs) work across hosts?

  **Precondition surfaced 2026-08-06.** This question treats the host
  as the scheduling and isolation unit, which assumes isolation exists
  within a host. It does not. Two daemons on one machine share the
  control socket path and the tmux session prefix, and the second one
  takes the socket and kills the first one's fleet. Whatever answers
  `question-daemon-isolation-boundary` also decides what a Host
  resource is actually a boundary around, so that question is worth
  settling before the scheduling algorithm is designed on top of it.

  **Second precondition, answered in part 2026-09-14.** The first
  cross-host channel is not switchboard and not scheduling. It is the
  director-supervisor bus: a global NATS tier that each host's local
  broker joins as a leaf node under its own NKey (director R-86, brief
  8, mechanism proven on one laptop with two throwaway leaves). Hosts
  are named by cluster name, a subject token, and the only things that
  cross are the supervisor and director inboxes plus a presence KV. So
  the multi-host question splits: the coordination channel across hosts
  now has a shape, and what remains here is placement (which host runs
  which team) and the unreachable-host case. The unreachable case has a
  measured partial: a leaf outage strands nothing, because JetStream on
  each side is its own domain and messages to the hub replay when the
  leaf reconnects. Discovery has a partial too: marvel's existing key
  exchange between clusters is the enrollment plane for the bus
  credential (R-94, brief 9), which means a host marvel knows is a host
  the bus can admit. Scheduling across hosts stays open and still waits
  on the daemon-isolation boundary above.
