id: question-credential-custody-beyond-nkey
type: question
confidence: frontier
title: "Can marvel's credential resource carry more kinds of sensitive material, and which of them is issuance versus custody?"
content: |
  The operator asked (2026-10-04) for marvel's credential to handle more
  sensitive data transfer: ssh keys, certificates, passwords, license files,
  API keys, "whatever we need". The idea is
  `_kos/ideas/credential-kinds-beyond-nkey.md` (marvel#527); the work item is
  bd aae-orc-p4fzv. This node holds the question, not an answer.

  WHAT IS TRUE TODAY (checked against main ea47261, finding-065):

  1. The kind set is closed with one member, `nats-nkey-seed`
     (`internal/api/types.go:824-836`).
  2. The store validates the kind and not the value
     (`internal/api/store.go:614-627`).
  3. A put under an unrecognised name is stored, acknowledged and read by
     nothing (marvel#344, open).
  4. Values are transient: no bolt bucket, `Persist` is always false, and a
     restart drops every value (`store.go:606-612`).
  5. Reveal is `marvel credential get --reveal`, served on the local socket
     only (`internal/daemon/scope.go:111-114`).
  6. A bd password already sits under the seed kind, with a binding that
     reads "NOT A SEED" and that nothing reads (aae-orc#461).

  THE QUESTION. SOUL section 3 and ADR-009 draw the custody line by audience:
  marvel may hold what it can itself revoke or re-mint without a human at a
  third party's console, and must not hold bearer authority at a third party.
  The nkey seed is on the issuance side. An API key, an ssh private key or a
  password for someone else's service is closer to the other side. Which of
  the operator's kinds is issuance (a transient hand-off marvel can drop and
  re-request), which would make marvel a custodian, and does the answer mean a
  new kind per material or a different resource for material marvel only
  relays?

  OPEN SUB-QUESTIONS.
  - Should the store check a value against its kind?
  - Does a memory-only value change the custody answer, or only how long
    marvel holds the material?
  - A research seat noted that values passed with `tmux new-window -e` may show
    in `ps eww`. Not re-measured; a candidate test for this question.
  - A license file may not be bearer authority at all.

  FEEDS FROM: the in-flight bd-credential probe (research seat); its findings
  stay with it.
