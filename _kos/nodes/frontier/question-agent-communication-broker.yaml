id: question-agent-communication-broker
type: question
confidence: frontier
title: "What's the broker-first agent-communication protocol — topics + subscriptions + auth, transports as detail?"
tags:
  - marvel
  - communication
  - broker
  - director
content: |
  **Reframed in session-017.** Original framing was three transports
  (named pipes, tmux send-keys, switchboard relay) plus four message
  types (task, result, heartbeat, signal) — but that's transports
  without a broker. Asymmetric coupling pretending to be symmetric.

  **New framing:** topics and subscriptions with auth, transports as
  implementation detail. Broker candidates:
  - **Embedded NATS JetStream** — single binary, persistent streams,
    auth model, well-understood. Probable default.
  - **RabbitMQ** — external service, more operations cost.
  - **SQLite-backed custom** — minimal dependency, less battle-tested.

  Tension with `aae-orc::val-gradual-elaboration`: zero agents are
  communicating today. Adopting the mental model now is cheap; adopting
  the *implementation* now is premature. Decision: name the model in
  the charter (this node), defer broker selection + implementation
  until concrete need.

  Cross-ref: `aae-orc::question-director-design` — director is the
  consumer of this protocol once agents need to coordinate. Director
  doesn't yet exist as a git repo.

  Tracked: `aae-orc-bga` (validate marvel agent communication
  protocol).

  **2026-08-01 ruling (marvel remap governance interview, round 2; orc
  docs/marvel-remap-2026-08.md section 4):** external NATS,
  marvel-supervised as a declared workload (the same supervision
  pattern as the sidecar-collector spike, `aae-orc-h6ck`). Embedded
  NATS declined; nats-server becomes a runtime dependency via
  mise/brew, and marvel stays thin. The envelope starts from the orc
  draft `docs/design/director-envelope-and-adapter-events.md`;
  schema-first codegen per the language ruling.

  **2026-09-12 addition (operator ruling via the director seat, after the
  naming party):** the spawn half is now a forward requirement on marvel.
  marvel knows how to start a director-enabled session and connect it to
  the supervised bus (agent id, bus URL, per-session credential injected
  at launch beside the heartbeat token), and the bus is two-tier: local
  per marvel cluster, global for the director-supervisor channel across
  hosts. Capture: `_kos/ideas/identity-at-launch-and-managed-nats.md`;
  director register R-83 through R-86 (class FORWARD).

  **2026-09-14 (architect session; twin run 1 and the global tier
  MVP).** Both tiers now exist as running code on one laptop, and the
  question narrows from "which broker" to "what marvel must know
  about the broker it supervises."

  Local tier, measured through marvel: a four-role twin fleet launched
  from a marvel manifest with the director shim as an MCP server. The
  shim renews presence on its own 30s timer through idle and through
  turns (director R-56 holds). A killed replicas-1 role respawns under
  the same name in about a second, and `daemon reexec` adopts the panes
  with pids unchanged; the bus resumes without the session noticing.
  Two defects surfaced. The shim derived a target's inbox subject from
  the SENDER's workspace, so cross-workspace sends misdelivered (R-92;
  fixed by roster resolution over presence records). And marvel reported
  a session as running whose shim had exited at start against a bare
  broker, because a role with no declared healthcheck is healthy while
  its pid lives (orc finding-166; R-93 ratified). The heartbeat token the
  daemon already mints is the seam: the shim becomes a third consumer of
  the heartbeat timer, and the health column carries bus liveness.

  Global tier (R-86), proven 8/8: a hub nats-server in JetStream domain
  `global`, each cluster's local broker joining as a leaf node with its
  own NKey and its own JetStream domain, only subject interest crossing.
  Only two role words cross the boundary, supervisor and director, and
  the director alone publishes outward across any boundary (R-95). What
  this asks of marvel: the leaf credential enrolls through marvel's own
  key exchange and lands in the daemon as a transient credential the
  broker reads at start (R-94, director brief 9, tickets S1 through S6);
  the global mode of the shim is one launch-time flag away. Captures:
  director/sim/design/global-bus-tier.md (brief 8),
  director/sim/design/bus-credential-enrollment.md (brief 9),
  director/sim/twin/checks-2026-09-14.md (the run record).
