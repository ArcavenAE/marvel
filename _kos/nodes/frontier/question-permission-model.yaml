id: question-permission-model
type: question
confidence: frontier
title: "What's the permission model — environment construction + internal RPC capabilities?"
tags:
  - marvel
  - permission
  - capabilities
content: |
  Two complementary layers:

  1. **Environment construction** — marvel writes
     `settings.local.json` with the role's Claude Code permission
     mode, controls filesystem mounts, sandbox boundaries (composes
     with `aae-orc::elem-curtain` when sandbox profiles ship).
  2. **Internal capabilities** — role-based RPC authorization on
     daemon methods. Workers get `heartbeat` + `query`. Supervisors
     get `inject` + `scale` + `shift` + `capture`. Both layers
     declared in team manifest, enforced by marvel.

  Replaces per-machine hooks (DCG), per-user settings,
  daemon-level checks.

  **Depends on:** `elem-runtime-adapter-framework` — the runtime
  adapter is what *constructs the environment* the layer-1 enforcement
  takes effect against.

  Tracked: `aae-orc-6xc` (design environment-as-permission model),
  `aae-orc-ukz` (daemon RPC role-based capability checks),
  `aae-orc-6spa` (manifest permissions modes incl. `auto`).

  LAYER 1 LANDED 2026-08-01 (finding-006). The Policy resource
  (`aae-orc-k3a`, PR #84) implements environment construction: marvel
  projects a Claude Code settings fragment per session at spawn and
  re-projects it live when the manifest changes, with no restart, via
  `ProjectionFor` on the runtime Adapter interface. `aae-orc-6spa`
  (PR #85) closed the manifest permission-mode validation half. What
  remains is the tamper-proofing of the projected file against its own
  agent (`aae-orc-wbqi`) and the sandbox composition with curtain
  (`aae-orc-10x`, blocked on curtain).

  LAYER 2 STILL OPEN. Role-based RPC authorization on daemon methods
  is unbuilt; it is Wave 3 (`aae-orc-bs3x` principal model + per-method
  authorization, converging `aae-orc-ukz` and the `aae-orc-mr5c`
  heartbeat-binding bug). The node stays frontier until layer 2 ships.

  Open sub-questions:
  - Exact manifest schema for declaring per-role capabilities?
  - How does the layer-1 enforcement compose with curtain's
    sandbox profiles when both are present?
  - What's the audit-trail signal for capability denials?

  HARVEST 2026-08-09 (finding-022). The heartbeat RPC is now bound to the
  session it claims, and the way it was done is the answer to the third
  sub-question above for at least this one capability.

  session.Manager.Create mints a 256-bit token before the record exists;
  the digest rides the record (persisted, so adopted sessions survive a
  daemon restart) and the plaintext goes only into the pane environment.
  The check moved INTO Store.UpdateSessionHeartbeat's signature under the
  same lock as the write, so it is not caller discipline. Refusals emit
  heartbeat.refused on the ring. Senders read the env var rather than a
  flag, because argv is world-readable from the process table. One
  deliberate fail-open: a record with no token hash is admitted and emits
  heartbeat.unbound, because refusing would make adopt-on-restart
  destructive on upgrade; it drains as those sessions end.

  This is enforcement locus 1 doing work, and it stayed inside the M1
  boundary: no principal model, no token service, no policy language.

  THE DURABLE POINT IS BROADER THAN THE FIX. api.Session reaches bbolt
  and every mrvl:// client through the same encoder, so ANY CREDENTIAL
  ADDED TO A STORE RESOURCE IS PUBLISHED BY DEFAULT. Bears on
  aae-orc-wbqi (projected policy tamper-proofing).

  A SECOND INSTANCE OF THE SAME SHAPE landed the same day from an
  unrelated arm: Crush's GET /v1/workspaces serves the registering
  client's full process environment, so enabling that channel would
  publish the environment marvel constructed at spawn to every client of
  a host-shared socket (finding-020 section 6). One path is ours and one
  is a vendor's, and both say the same thing: a credential adjacent to a
  value that gets serialized is a credential that gets served, and the
  axis that predicts it is where the bytes go rather than who was asked.
  Since environment construction at spawn is marvel's ONE built
  enforcement locus, that is an inversion of this question's premise
  rather than a cost to price against it.

  TWO LIMITS NOT ADDRESSED by the heartbeat fix, both named in
  finding-022: same-uid environment reads (an agent that hunts can take a
  sibling's token, which is enforcement locus 3 plus curtain), and
  event-ring pressure from spammed refusals.

  LAYER 1 FOR A NON-PROJECTING HARNESS IS THE HARNESS'S OWN SANDBOX
  (finding-048, 2026-09-17). The Policy projection above is the claude
  path: marvel writes a settings fragment via `ProjectionFor`. The codex
  adapter reports no projection surface (codex.go) and marvel injects no
  codex sandbox, so for a codex role the Layer-1 enforcement is codex's
  own sandbox, set at launch through `runtime.Args`
  (`-s workspace-write`, the pinned cwd as the writable root, `--add-dir`
  for extra roots). Proved on gpt-5.6-luna: a codex role wrote only to its
  pinned cwd and was refused everywhere else while reading the repo for
  context. This answers the second open sub-question above (how Layer 1
  composes with a sandbox) for the interim, harness-native case: the
  writable-root set is a single named parameter today, which is what a
  later curtain policy would take declaratively (aae-orc-10x). One adapter
  gap surfaced: codex `file_change` items are unmapped by marvel's codex
  parser, so a write-capable codex role's writes read as `agent.error` on
  the ring (flat marvel task).

  QUALIFIED (finding-049, 2026-09-17): codex's own sandbox is Layer 1 ONLY
  when the target is not a codex TRUSTED project. A per-project
  `trust_level = "trusted"` in `~/.codex/config.toml` makes that project's
  tree writable by codex's `apply_patch` tool regardless of `-s`, and a
  `-c` override of the projects table does not lift it. The live `aae-orc`
  repo is trusted for the operator's own convenience, so against the live
  target both the read-only reviewer and the constrained-write retrospector
  could write the repo. Disk-verified; the model self-reported "refused"
  while the file landed, so the write verify must read the filesystem, not
  the model. A second lever compounds it: `approvals_reviewer =
  "auto_review"` in the operator config auto-approves an out-of-sandbox
  write even against an untrusted project. The fix keeps marvel out of the
  operator's config: give the codex role its own `CODEX_HOME` built as an
  allowlist (model, reasoning, and `[mcp_servers.*]` only, so it carries
  neither a trusted project nor an auto-approving review policy; identity
  files symlinked back, `[mcp_servers.director]` kept so the bus channel
  survives), and `-s` governs writes again. That is environment
  construction one config layer below the claude projection: marvel controls
  the harness's trust surface by constructing the role's config home rather
  than by owning the operator's.
