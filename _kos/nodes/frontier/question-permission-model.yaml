id: question-permission-model
type: question
confidence: frontier
title: "What's the permission model — environment construction + internal RPC capabilities?"
tags:
  - marvel
  - permission
  - capabilities
content: |
  Two complementary layers:

  1. **Environment construction** — marvel writes
     `settings.local.json` with the role's Claude Code permission
     mode, controls filesystem mounts, sandbox boundaries (composes
     with `aae-orc::elem-curtain` when sandbox profiles ship).
  2. **Internal capabilities** — role-based RPC authorization on
     daemon methods. Workers get `heartbeat` + `query`. Supervisors
     get `inject` + `scale` + `shift` + `capture`. Both layers
     declared in team manifest, enforced by marvel.

  Replaces per-machine hooks (DCG), per-user settings,
  daemon-level checks.

  **Depends on:** `elem-runtime-adapter-framework` — the runtime
  adapter is what *constructs the environment* the layer-1 enforcement
  takes effect against.

  Tracked: `aae-orc-6xc` (design environment-as-permission model),
  `aae-orc-ukz` (daemon RPC role-based capability checks),
  `aae-orc-6spa` (manifest permissions modes incl. `auto`).

  Open sub-questions:
  - Exact manifest schema for declaring per-role capabilities?
  - How does the layer-1 enforcement compose with curtain's
    sandbox profiles when both are present?
  - What's the audit-trail signal for capability denials?
