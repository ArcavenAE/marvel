id: question-multicluster-view
type: question
confidence: frontier
title: "How should one marvel client read several clusters at once, and what must stay single-cluster?"
tags:
  - marvel
  - cli
  - clusters
content: |
  Extracted from `_kos/ideas/multicluster-view.md` (seeded by the operator
  2026-10-04). The operator, verbatim, on taking it further: "yes, let's do
  it 6ptdd". A six-round design panel ran on 2026-10-10 against marvel main
  a35d93d; the design ticket is #816.

  WHAT EXISTS: the client talks to one daemon per command, resolved as
  `--socket`; then a cluster named with `--cluster`; then `MARVEL_SOCKET`,
  only when no cluster is named (#586); then the config's current cluster;
  then the layout default (`cmd/marvel/main.go`, `resolveDaemonRung`). Every
  seat has `MARVEL_SOCKET` set, so in a multi-cluster read each cluster
  resolves from its own config entry only and never falls to that rung.
  Clusters are named
  config entries, each with its own address and identity. An unreachable
  cluster waits out the SSH dial and then prints usage text (#812).

  AGREED BY THE PANEL (see #816 for the full list):
  - reads may span clusters; every write names one cluster;
  - each cluster resolves from its own entry only, with a per-call timer
    over the whole exchange and no prompt during a fan-out;
  - every named cluster gets an outcome line and record, and a partial
    answer exits with its own nonzero code;
  - one KEY cell `<cluster>:<workspace>/<name>`, a stable sort on the
    fields, and a write that takes a qualified key also needs a typed
    `--cluster` that matches;
  - two entries reaching one daemon merge only when `version` and the
    session sets agree, so a merge never removes a session from view;
  - nine single-cluster fixes ship first, each standing alone.

  OPEN (operator decisions):
  1. Whether `kill`, `delete` and `inject` need a typed cluster once a
     config holds more than one cluster, or keep today's default with the
     cluster named on the result line (panel 3-3).
  2. Whether a character rule for new workspace names lands before the
     qualified-key grammar, or separately without gating it (panel 3-3).
  3. Whether seats may ever read other clusters; the panel's 4-1 view is
     not until a read-only daemon scope exists, and then by its own ruling.

  BUILD PLAN 2026-10-21 (docs/design/multicluster-read-view-plan.md). A second
  design panel turned the 2026-10-10 agreement into a link-by-link build
  plan, and the operator ruled its open requests on 2026-10-21. R1: during a
  fan-out each cluster's dial offers exactly one key, the identity in that
  cluster's entry or marvel's own client key, and never the SSH agent or the
  user's SSH directory keys; a cluster with neither loadable gets
  `auth_refused` before any dial. R2: two entries merge only on the same
  socket inode, or a strict-verified host fingerprint (plus the socket path
  for `ssh://`) with a matching pid and start time. R3: the placeholder for an
  unprintable cell is U+FFFD. R4: exit 10 for `starting` applies only under
  `--cluster` with two or more clusters or `--all-clusters`; a single named
  cluster keeps today's exit. On marvel#761: the timer is set only in the
  fan-out (10 s per cluster, in #830), and one byte cap covers every reply as
  a trial, with the per-fan-out and per-verb caps kept as the next options.
  The cap's value is not named and its basis is open with the operator.
  Whether the three OPEN items above are now answered is not read here.

