id: question-persistence
type: question
confidence: frontier
title: "Persistence — pack-resolution cache and volume-mount records"
content: |
  Narrowed. The core "what state survives daemon restart" question is
  answered: the L2 bbolt WAL layer persists workspace/team/role/session
  intent, session→pane bindings, shift generation, and RoleHealth
  backoff state, and AdoptOrKill reconciles against it on restart. The
  store choice (bbolt over SQLite / flat files / etcd), the Persist /
  Derive / Ephemeral classification, and the recovery-vs-reconcile
  tradeoff are all settled. See question-marvel-transaction-log (now
  bedrock) and finding-050.

  What genuinely stays open is the state the transaction-log work did
  not cover because it does not exist yet:

  - **Pack-resolution cache.** Once marvel resolves content packs
    (question-pack-integration / F6), the resolved-pack set for a team
    is derived state that could be cached to avoid re-resolving on every
    restart. Whether it is persisted, re-derived, or treated as ephemeral
    is undecided and gated on pack integration landing.
  - **Volume-mount records.** If a role declares workspace volumes or
    mounts, the binding between a session and its mounted paths is
    durable state not currently modeled. Undecided and gated on the
    volume feature existing.

  Both are Derive-or-Persist calls that cannot be made until the
  features they describe exist. This node holds that remainder.
