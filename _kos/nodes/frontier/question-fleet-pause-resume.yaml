id: question-fleet-pause-resume
type: question
confidence: frontier
title: "Can marvel pause a running fleet, or one seat, and resume it without losing work or connections?"
tags:
  - marvel
  - session
  - tmux
  - pause
content: |
  The operator asked whether marvel could suspend every running harness and
  resume it later, without losing in-flight work or connections. Design:
  `docs/design/fleet-suspend-resume.md`. Brief:
  `_kos/probes/brief-fleet-pause-signals.md`. Idea:
  `_kos/ideas/fleet-pause-resume.md`.

  MEASURED (finding-marvel-1kg8, marvel#722, Darwin, tmux 3.7b, four
  harnesses, scratch daemon only):

  1. A whole-fleet freeze comes back for up to an hour, but only when the
     stop reaches the tmux server before the seats. A SIGSTOP to a pane's own
     process is undone by the tmux server within a second, so a per-seat
     SIGSTOP does not hold.
  2. While tmux is frozen, today's daemon answers no call, not even status,
     start or shutdown. Standalone defects marvel#715, #716, #717.

  MEASURED (finding-marvel-1eds, marvel#767). The task_suspend research
  items R1 to R5 map to its sections as follows:

  - R1 (section 1): task_for_pid on a hardened-runtime target fails without
    get-task-allow, even from a helper carrying `cs.debugger`.
  - R2 (section 3, CODE): in xnu `kern_proc.c`, pid_suspend runs a MAC
    suspend check for every caller and a taskgated upcall for a caller that
    is not root. The policy behind the MAC hooks is not open source, so
    whether root gets past the hardened runtime is UNKNOWN.
  - R3 (section 2): an unprivileged ad-hoc helper with `cs.debugger`
    suspends claude, codex, crush and opencode through pid_suspend. The
    suspend holds after the helper exits; `kill -CONT` does not undo it; a
    running tmux server did not undo it across a resize and a key. It does
    not nest, `ps` shows `SN` not `T`, and it covers one process only, so a
    child keeps running.
  - R4 (section 4): re-reading finding-marvel-1kg8, SIGSTOP with the tmux
    server stopped first lost no seat, but it cannot freeze one seat while
    tmux runs. pid_suspend closes that gap for the stimuli tried.
  - R5 (section 5): OPEN. The runs may have ridden a cached task port grant
    (about 10 h, group `_developer`), so it is not shown to work unattended.

  RULING (operator, 2026-10-08, relayed by director): the committed record
  is finding-marvel-1eds section 6 (marvel#774), which quotes the text of
  option (a), the option chosen: do not run the root half. The same section
  records the operator's note: "dont run root right now, can run later". The
  root route stays unrun, not ruled out. The unattended re-run, the
  `_developer` question, whether a notarized marvel may carry
  `cs.debugger`, and a resume ledger are the checks before any build.

  RULING (operator, 2026-10-07, relayed by director, no committed record):
  the pause method ruling that commissioned the server-plus-trees freeze
  runs (finding-marvel-1kg8 F1 to F3) ahead of the Mach, wrapper-pane and
  Linux cgroup arms.

  OPEN:
  - Does pid_suspend work with no cached grant (a run more than 10 h after
    any task port prompt), and does it depend on `_developer` membership?
  - Can the daemon stay answerable while its tmux server is frozen?
  - Linux: the cgroup freezer arm has no measurement yet.

  RETIRED ID: finding-marvel-wsmw was minted on 2026-10-07 for the first
  pause probe and never written; no file by that id exists in
  `_kos/findings/`. This harvest (2026-10-09, at the supervisor's request)
  retires it, and this node is its only committed record. Its measurements
  are in finding-marvel-1kg8. Nothing should cite wsmw.

  GRAVEYARD CANDIDATES, judged by the supervisor, not moved here: pause by
  kill signal to a pane process; a tmux-frozen pause as a per-seat method;
  one-shot task_suspend (it ends when the helper exits).
