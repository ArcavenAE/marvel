id: question-pack-integration
type: question
confidence: frontier
title: "Content Pack Integration — resolution, routing, scope chain"
content: |
  pack.yaml manifest is sketched in marvel's CLAUDE.md. Packs are git repos
  with heterogeneous artifacts (commands, templates, themes, workflows).
  Marvel must resolve packs via the 4-scope chain (repo → shared → user →
  system) and route artifacts to the right filesystem locations for the
  target runtime.

  Questions: is YAML the right manifest format (vs TOML for consistency)?
  How do packs declare dependencies on other packs? How do packs declare
  minimum marvel version? How does multi-pack conflict resolution work
  when two packs provide the same artifact type? How does a compiled
  binary (forestage) discover packs at runtime?

  REVISED 2026-11-02. The companies design (`docs/design/companies.md`,
  marvel#1191, c815c13e; status "design, for a ruling", nothing built) states
  "Pack is not a marvel word" and replaces the pack framing above with a
  company (a library of team, workflow and agent definitions), a cast (the
  teams running on one cluster, each drawn from a company), and three tiers:
  master (the library's git repository at a commit), reference copy (one
  installed version under a company root) and working copy (what one session
  runs from, derived at launch). marvel#1210 (c1976d32) adds that the set of
  paths `marvel cp` refuses is the companies root set. The questions above
  about manifest format, dependencies, minimum version and conflict
  resolution should be read through that vocabulary, with the design as the
  open proposal. This stays frontier until the operator rules the design.

