id: question-interactive-context-pressure
type: question
confidence: frontier
title: "Context pressure for interactive/TUI sessions: which cooperative channel per harness, at what consent grade, against which denominator?"
tags:
  - marvel
  - observability
  - streaming
  - harness
content: |
  The frkq probe (finding-007) settled how to reconstruct context
  pressure (CTX%) from a harness's structured stream, but it measured
  only HEADLESS mode: `claude -p --output-format stream-json`,
  `codex exec --json`, `opencode run --format json`. Interactive/TUI
  sessions were never explored, and they are the harder case.

  Why the headless answer does not carry over:

  - Interactive claude/codex/opencode render an ANSI TUI to the pane
    and emit no structured usage block. The usage-accountant w5su
    builds (occupancy = input + cache_read + cache_creation over the
    model's `contextWindow`) has no input in TUI mode; none of those
    fields are on the wire.
  - The shim (finding-004, `question-marvel-stream-attachment` shim
    candidate; bd aae-orc-gtpz) does NOT rescue this. It tees the
    pane's bytes, but in TUI mode those bytes are the rendered screen,
    not JSON. Teeing yields a faithful screen copy, not a usage block.
  - The only apparent path is `capture-pane` scraping of the rendered
    context indicator (the on-screen "context left / % until
    auto-compact" readout). That is the capture-pane fidelity tier from
    finding-005: it works, but it is version-fragile (depends on TUI
    layout and wording), per-harness (each TUI differs), and yields the
    harness's NORMALIZED figure (a threshold plus a reserved buffer,
    per finding-007 SP4) rather than raw occupancy.

  Applies to ALL target harnesses, not just claude. It matters because
  a long-lived human-in-the-loop supervisor (or the interactive
  reviewer in the Act 3 demo) is exactly the session where live context
  pressure is most useful, and it is the session the headless-scoped
  design cannot meter cleanly.

  Decision to make:
  - (a) Build per-harness capture-pane scrapers for the rendered
    indicator. Accept the fragility and the normalized (not raw)
    figure. Each harness TUI needs its own scrape + a re-check per
    harness version.
  - (b) Accept CTX% as a headless-only signal. Document that
    interactive sessions carry no CTX%, and steer metered fleets to
    headless mode.

  A hybrid is possible: headless sessions get the exact accountant
  value (w5su); interactive sessions get a best-effort scraped figure
  clearly labelled as approximate and harness-normalized.

  STATE 2026-08-06 (supersedes the framing above for claude):

  - Interactive claude is SOLVED, and by neither (a) nor (b): the
    statusline side channel (finding-011) exports raw occupancy WITH
    the window denominator; shipped as `runtime.context_feed =
    "statusline"` plus `marvel ctx-forward` into the heartbeat RPC.
    The scrape-vs-headless-only dichotomy was false for claude; a
    third, cooperative channel existed.
  - codex and gemini have a named candidate (native OTEL, finding-008;
    capable but not live-verified, occupancy derivation open).
  - opencode and Crush have no verified channel; opencode's HTTP API
    and plugin surface are unchecked candidates.
  - Capture-pane scraping (option (a)) is ruled out as a default path:
    fragile, per-harness, normalized figure, and now beaten on every
    axis by the statusline precedent. Reopen only by deliberate
    operator decision.
  - Remaining work is structured as a two-phase sweep (secondary desk
    catalog across all four runtimes, then primary live verification
    for surviving candidates only, with a kill rule to headless-only):
    probe-interactive-ctx-remainder-sweep.md.

  STATE 2026-08-08. The question is ANSWERED IN SHAPE by an operator
  ruling, and the two options in the title are both retired.

  OPTION (c), RULED: per-harness cooperative channels, graded by
  CONSENT, arbitrated by FIDELITY.

  - Consent GATES rather than orders, in three grades. CONTRACTED: the
    harness publishes it for consumers (a documented socket, an HTTP
    API, a hook, OTEL). CONCEDED: the harness hands marvel the pointer,
    so one field converts a glob into a handoff (claude's
    `transcript_path`, codex's `agent_transcript_path`, a Crush
    `PreToolUse` hook exporting `CRUSH_SESSION_ID`). APPROPRIATED:
    marvel went looking. Appropriated is OFF the ladder, not a low rung
    on it: a probe instrument only, whose production form is whatever
    conceded or contracted variant can be negotiated.
  - Fidelity orders separately: proximity to a per-request prompt level
    with the token classes intact.
  - The capture-pane ruling above SURVIVES but its stated reason was
    slightly wrong, and the wrong reason generalizes badly. A TUI's
    disqualifier is not that it is uncooperative. It is that THERE IS
    NO VERSION NUMBER ON THE SCREEN, so it can only fail quietly.
    Uncooperative-with-a-version-handle (a database carrying a
    migration table) is a different animal from
    uncooperative-without-one.

  Three constraints (c) carries that (a) and (b) never had to answer:

  1. A channel can be fully CONTRACTED and still not free. Attaching to
     Crush's documented event stream registers marvel as a real client:
     `AttachClient` bumps a stream count, `attached_clients` is exposed
     on the session, and observers use stream count to detect live
     subscribers. During the sweep an unobserved workspace was reaped
     before use. Merely starting a Crush server also refreshed
     host-global caches outside the probe sandbox. Neither is a consent
     failure; both are observation changing the observed system, so
     PERTURBATION is a third property the consent axis does not
     predict.
  2. Credential adjacency is categorical, not a matter of care.
     `opencode.db` holds credential and account tables in the same file
     as the token counts. A capture-pane scrape physically cannot reach
     a credential; a database handle can. SOUL section 3 makes that a
     boundary rather than a risk to manage.
  3. A channel available only where the harness happens to run cannot
     be a FOUNDATION, because a foundation must be uniform across the
     fleet. Local reads are an optimization that raises fidelity where
     they exist, never the plan.

  DENOMINATOR VARIANCE, from finding-016 and load-bearing here: the
  quantity that predicts compaction is the EFFECTIVE AUTO-COMPACT
  WINDOW, not the model context window, and it varies on six
  independent axes (harness release, user settings, model, backend
  service, entitlement, model slot). Measured p50 fire point 467635
  against a configured 500000 (93.5 percent); the same occupancy over a
  1M context window reads 46.8 percent. So a channel that delivers a
  numerator without declaring WHICH denominator it is against delivers
  a number that is wrong by 2x half the time.

  RESOLUTION LADDER, operator-ruled 2026-08-08: a harness-declared
  window arriving via the statusline FEED gets its own `LimitSource`
  rung ranked BELOW `LimitFromManifest`. Stream stays at rung 1 above
  manifest, so the same fact from the same harness carries opposite
  precedence depending on transport. Deliberate (a live stream is not a
  side channel) and surprising, so it must be documented rather than
  discovered. Tracked: aae-orc-38yr.

  IMPLEMENTATION ORDER, operator-ruled: codex, then Crush, then
  opencode, with cross-cutting plumbing first. bd aae-orc-pt8k (codex),
  aae-orc-k2mi (Crush), aae-orc-9jvb (opencode). The plumbing that
  gated all three shipped in marvel#153 and #154.

  CODEX DONE 2026-08-08 (finding-017, marvel#156 and #159), and it did not
  land the way this order anticipated. The probe did not add a codex
  occupancy channel; it REMOVED one that was never real. `turn.completed`
  is a running session total rather than a per-request level, so the exec
  stream yields no occupancy at all and codex CTX% now renders absent
  rather than a wrong number. Full correction and its four supporting
  measurements: question-stream-attachment correction (iii). Crush
  (k2mi) and opencode (9jvb) remain, and remain serialized, because all
  three land in `internal/usage`.

  THE LADDER IS BUILT, THE FEED IS NOT WIRED TO IT (marvel#159,
  aae-orc-38yr still open). `LimitFromFeed` exists at the ruled rung, and
  precedence is now an explicit total ordering with a test that parses the
  constants out of `limits.go` so a rung-less `LimitSource` fails. But the
  statusline feed does not stamp the WRONG source, it stamps NOTHING:
  `ctx-forward` parsed the declared window, used it for a local
  cross-check, and dropped it before the heartbeat. The producer half now
  emits it; `internal/daemon` has no field to receive it and `internal/api`
  leaves `ContextLimit` at zero.

  Two traps recorded on 38yr for whoever finishes it. Stamping "feed" in
  the store would implement the LABEL without the LADDER, because the
  ruling only bites if the heartbeat path calls `Resolve` with both the
  feed limit and the manifest limit. And `UpdateSessionHeartbeat`'s
  percentage-only shape is the DISCRIMINATOR telling the two CTX%
  producers apart downstream, including in bolt rehydrate and the
  renderer, so adding a window narrows it: a contract decision, not
  plumbing.

  THE CONSENT CATALOG NAMED THE WRONG CODEX FIELD. This node's CONCEDED
  grade cites codex's `agent_transcript_path`. All eleven hook input
  schemas embedded in the binary require `transcript_path`;
  `agent_transcript_path` appears in exactly one, `subagent-stop`, and is a
  subagent's file. The consent GRADE is unchanged and the channel works;
  the field name was wrong, and a design built on it would have found it
  absent everywhere it mattered.

  HEADROOM IS A SEPARATE QUANTITY WITH A SEPARATE ATTRIBUTION RULE
  (`probe-rate-limit-headroom-channel-catalog.md`, aae-orc-reif). Claude's
  statusline already carries `rate_limits` with five-hour and seven-day
  windows, sourced from response headers, and `ctx-forward` was discarding
  it because its struct omitted the field. Captured in marvel#159.
  Deliberately NOT forwarded over the heartbeat: headroom is
  account-scoped, so N sessions on one account are N reporters of ONE
  quantity, and a per-session column of it would be a category error
  rather than merely a hard problem. Also corrects finding-007 on codex:
  the path is `payload.rate_limits`, a sibling of `payload.info`, not
  inside it. opencode and Crush have no headroom channel at all.

  THE COMPACTION CORPUS IS MINED (finding-023, 2026-08-09), and the
  detector it was mined to test passed. 63 of 63 labelled Claude
  compactions with a sample on each side were detected by the shipped
  hysteresis, zero false negatives, minimum margin 4.03x over the guard.
  The comment at `accountant.go:14-31` calling the bound reasoned rather
  than calibrated can be retired: it is calibrated now, against 63 events
  rather than one recovered geometry, with a regression fixture at
  `internal/usage/testdata/compaction_series_claudecode.json`.

  What the same corpus says about the channel matters more than the
  detector result, because all three items report LOW pressure at HIGH
  pressure, which is the direction that silently disables rotation:

  - **19 of 82 boundaries produce no post-boundary sample in marvel's
    series at all**, so the detector cannot fire on them. In the clearest
    session the last sample naming its latched primary model sits at line
    3,110 of 5,283 and the six compactions after it are invisible.
  - **The primary-model latch freezes CTX% permanently.** `fold` latches
    the first model it sees and never re-latches. 19 sessions switch
    model and never switch back; 3,563 later samples go to spend, the
    sink is never written again, and the store keeps rendering the frozen
    figure as current. Worst case froze at 79,246 tokens while the
    session reached 751,169. That is a larger error than the denominator
    error `aae-orc-sj34` was filed for, and it is silent. finding-016
    already ruled that a model change invalidates the reading; this is
    the measured cost of not having implemented it.
  - **Zero-occupancy records exist on claude too.** 68 non-sidechain
    assistant records carry all three prompt classes at zero. 67 name
    `<synthetic>` and are excluded incidentally by the non-primary-model
    guard; ONE names the session's real model, passes every guard, and
    sits beside a compaction at 467,121 tokens. The discard rule
    `aae-orc-mob4` sets for codex must key on the token values, because
    the model name is not a reliable discriminator.

  Three further properties a per-harness reader must handle: transcript
  file order is NOT chronological (26 inversions, worst 25.2 hours, one
  reading 134,037 where the true level was 967,915); not every context
  drop is a labelled compaction (two drops of 16-20% with no boundary
  record, both after an `away_summary`); and a boundary's `postTokens` is
  not the level the next request carries (the first post-compaction
  sample runs a median 61,658 tokens above it).

  SP5 closed two runtimes negatively. gemini has a per-turn token series
  and no compaction field anywhere in its local chat files, so it has no
  ground truth on this machine; its `total` EXCLUDES `cached` (418 of 418
  cached rows), the opposite of opencode, while whether `input` subsumes
  `cached` is undecidable here because the largest observed prompt is
  51,209 against a window in the millions. opencode's
  `session_context_epoch` is present and empty, and its schema keys on
  `session_id` alone, so it is a pointer to the current epoch and can
  never hold a compaction history.

  Tracked: bd aae-orc-dc1j. Related: aae-orc-7hzb (statusline probe;
  its "other harnesses" remainder is absorbed by the sweep brief),
  aae-orc-w5su (headless CTX%; scope it headless-only so nobody
  assumes TUI coverage), aae-orc-gtpz (shim), finding-005
  (capture-pane tier), finding-007 (the headless probe that left this
  untouched), finding-008 (OTEL), finding-011 (statusline).
