id: question-harness-state-watchdog
type: question
confidence: frontier
title: "How far does marvel's harness-state watchdog see: a login that expires mid-session, and a seat on a harness version no pattern covers?"
tags:
  - marvel
  - observability
  - watchdog
  - health
content: |
  A seat whose login expired is a live process in a live pane, so it reads
  alive and keeps receiving work it cannot do (aae-orc-9box, finding-025). The
  watchdog is marvel's attempt at a classified state read from the pane
  (`_kos/ideas/tmux-harness-state-watchdog.md`), and this node holds what has
  been measured about how far it sees.

  MEASURED 2026-10-30 (finding-marvel-1ust). Code read at marvel 04c258f and
  the head of #1143; live panes read on one workstation, read-only, no key
  sent. The expired screen's layout rests on one pane.

  1. The shipped pattern is a different screen. The one pattern is the
     first-start login-method picker. Its own comment says a login that
     expires mid-session may draw another screen and reads unknown (#1079).
  2. The expired notice is not at the bottom. On the one pane that showed it
     (claude 2.1.310, 80x24) it sat 18 rows above the bottom, with more
     transcript after it and an empty composer below. The pattern model
     matches a block only at the bottom of the screen, so no new pattern in
     that model can match this screen. The composer reader reads that composer
     as empty, so the PANE column of #1143 would likely show `idle` (read from
     code, not run).
  3. Most seats are uncovered, and uncovered is silent. The pattern set covers
     claude 2.1.285 to 2.1.293. On the measured workstation 20 claude panes ran
     2.1.289 to 2.1.314, one of them in range. An uncovered version is stamped
     and never captured, and `get sessions` suffixes HEALTH only for
     logged-out and parked, so an uncovered seat reads bare `alive`.
  4. Release churn outpaces capture. About 21 claude patch releases landed in
     the 23 days after the range was set (2026-10-07).
  5. The quiet gate cannot open for a seat that keeps beating. Every heartbeat
     stamps `ContextAt`, and the gate measures from it (marvel#801). That a
     logged-out seat keeps beating is inferred from #801 and from the seats in
     the source report, not read from a beat log.
  6. The classifier core is pure and cheap: about 1.5 ms per pane for two tmux
     calls (#1143).

  RECOMMENDED in the finding, each for a ruling and none ruled: detect a
  mid-session expiry from the transcript's typed API error rather than from the
  pane; let a bottom-aligned picker on a claude version above the verified
  maximum set `logged-out`, marked unverified; give a seat whose watchdog
  coverage is `uncovered` or `control-failed` a GAP line in PANE; keep every
  count diagnostic, with only pattern controls, schema checks and the masking
  test allowed to gate.

  OPEN: the watchdog captures client-workspace panes while COMPOSER and PANE
  never do; is that asymmetry intended? Whether a pane string alone is
  trustworthy (a transcript can quote the notice) is unmeasured.
