id: question-team-load-rollup
type: question
confidence: frontier
title: "How does each cluster publish its teams' load so one reader can see the whole fleet, and who may write it?"
tags:
  - marvel
  - bus
  - observability
content: |
  Design: `docs/design/team-load-rollup.md` (marvel#775, rulings in
  marvel#783). Each daemon computes its own teams' rows. How a cluster's
  summary reaches the readers is D1, not ruled; the design's recommended
  transport is one hub KV key per cluster over the leaf. Rows follow the
  as-of grammar (fresh at or before valid_until). Open, unacked, blocked and
  oldest-open counts come from the merged ask ledger only.

  RULED (operator, 2026-10-08; recorded in the design's section 6 by
  marvel#783):
  - D2 (c): the keys are unauthenticated, and the header says so.
  - D3 (c), D5 (a), D6 (a), as written in the design's decisions section.

  RULED (operator, 2026-10-09, relayed by director; recorded in the
  design's section 6):
  - D4 (a): "Every 60 s, valid 180 s, max age 1 h".
  - The D3 amendment question (b): "No, D3 (c) stands as ruled". Pinned
    clusters are not added to the expected set.

  NOT RULED: D1 (how each cluster's summary reaches the readers). Plan items
  3 and 4 are written for the hub bucket, (a) or (d), and are not filed until
  D1 is ruled. The architect's recommendation, re-checked on 2026-10-09, is
  (d), signed records in that bucket, recorded in the design's section 6.

  D1, RELAYED, NO COMMITTED RECORD: a simulation of the D1 options ran on a
  scratch hub rig on 2026-10-08 (never the live hub). Its record is held
  locally and no finding stands behind it yet. It reported:
  - a KV put observed as a publish to `$JS.global.API.$KV.<bucket>.<key>`.
    The design still calls that subject assumed (`team-load-rollup.md`, the
    put-subject line in the D1 section); a finding would need to carry the
    measurement before the design relies on it;
  - a KV entry that names no writer;
  - a recommendation of signed records (option d, not in the design), with
    conditions. Its condition that pinned clusters count as expected was
    declined by the 2026-10-09 D3 ruling; the re-checked recommendation in
    the design drops it.

  PLAN (design section 7): items 1, 2, 5, 6 and 8 are filed as bd tickets
  aae-orc-6hcad, aae-orc-4m99a, aae-orc-2l2yh, aae-orc-fmhyt and
  aae-orc-xga6w with dependency edges. Only item 3 waited on D4, and it
  still waits on D1, so the D4 ruling unblocks no item by itself. Item 4
  depends on item 3, and item 7 on item 4.

  OPEN: D1.
edges:
