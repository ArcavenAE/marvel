id: question-shift-triggers
type: question
confidence: frontier
title: "Automatic Shift Triggers"
content: |
  Manual shifts work (bedrock). This question asks: what triggers
  shifts automatically?

  Known triggers from user input:
  - Scheduled ("shift change every 6 hours")
  - Context pressure (sessions exceed threshold)
  - Config changes (agent definitions need re-read)
  - Detected failures (repeated heartbeat misses, errors)
  - Login failures with Claude/LLM services
  - Service updates (Claude Code updates, API changes, new model)
  - Memory pressure (Claude Code reporting memory balloons)
  - Unexpected behavior by existing agents

  Questions:
  - Which triggers should be team-level vs role-level?
  - How does context pressure aggregate? (any session? average? all?)
    SEE THE 2026-08-08 STATE BELOW: this question is not merely open,
    it is posed wrongly, and answering it as stated would build a
    defect.
  - What failure detection is feasible with current heartbeat data?
  - How does marvel detect Claude Code updates or API changes?
  - Is Schedule resource type the right abstraction for timed shifts?

  STATE 2026-08-08. The context-pressure trigger listed above assumes a
  FILL LEVEL with a THRESHOLD. That framing is now understood to be
  wrong in three ways, and this node had carried it untouched since
  2026-03-31.

  1. THE THRESHOLD HAS NO STABLE DENOMINATOR. finding-016: the quantity
     that predicts compaction is the effective auto-compact window, not
     the model context window, and it varies on six independent axes
     (harness release, user settings, model, backend service,
     entitlement, model slot). A fleet runs combinations simultaneously,
     so a column of percentages computed against six-dimensionally
     varying denominators is a column of incommensurable numbers
     presented as comparable. Alerting on it is worse than sorting by
     it.
  2. OCCUPANCY IS A PRICE MULTIPLIER, NOT A CAPACITY CONSUMPTION.
     Context is rent, not purchase: the whole context is re-read at
     cache-read price every turn. Measured across 139 local sessions,
     cache-read tokens paid per output token produced: 107x below 100k
     median occupancy, 261x above 300k, a 2.4x ratio. A percentage
     discards exactly the information that makes the trigger
     actionable.
  3. AGGREGATION IS A SCHEDULING HAZARD, NOT A CHOICE OF STATISTIC.
     This is the sharp correction to the question as posed. Rate limits
     (input and output TPM, TPD, request rate, plan quota) bind per
     ACCOUNT and are shared across the whole fleet. A context-pressure
     trigger that fires on several agents at once consumes a burst of
     exactly the resource it does not model, so the remedy for one
     session degrades all of them. Any answer to "any session? average?
     all?" that does not model the shared limit is a correlated-failure
     generator.

  WHAT REPLACES A THRESHOLD. A per-role POLICY SELECTION plus its
  parameters, not a global percentage. Named candidates: never
  auto-compress (shift before the harness summarizes anything, correct
  when the accumulated context is the valuable artifact); allow
  auto-compression (correct when the model performs well hot, or a
  shift costs more than a compaction); hold below a cost ceiling
  (correct when carrying rate rather than capacity binds); refuse the
  dominated region.

  THE DOMINATED REGION IS NOT YET MEASURABLE, and this is a live
  constraint on any default. The operator observation is that above
  roughly 600k some models cost more AND fail more. SP1 attempted to
  locate that knee against the corpus and returned a clean negative:
  tool-error rate is flat at 2.7 to 5.3 percent across every occupancy
  band. Three reasons, the third structural: the proxy is weak, the
  sample thins where the question lives, and high-occupancy sessions
  are SURVIVORS by construction, since a session that degraded badly
  was compacted or abandoned before reaching the band that would show
  it. Survivorship means no purely observational read of this corpus
  can locate the knee. Until something measures it, the dominated
  region must not be built into a default. Next attempt is rework
  detection (aae-orc-tzzn).

  REWORK DETECTION RAN AND THE KNEE IS UNDECIDABLE FROM THIS CORPUS
  (`probe-rework-detection-result.md`, aae-orc-tzzn, 2026-08-08). A
  pre-registered failure signal fired, so it lands as a probe result and
  NOT as a finding. 255,071 transcript lines parsed, 0 parse failures.
  Rework does not separate across occupancy bands, in the same shape SP1's
  error rate did not: pooled repeated-invocation runs 0.23 to 1.59 percent
  below 600k and 1.24 percent (95 percent CI 0.68 to 2.27) above it, an
  interval that CONTAINS the below-600k rate.

  The verdict is "undecidable", deliberately not "invisible", because
  "invisible" would claim the measurement had power to see an effect and
  saw none. It did not have that power, and the probe can now say exactly
  where the power went. Three structural reasons, only the first
  anticipated by the brief:

  1. THE PRIMARY ANALYSIS CANNOT REACH THE KNEE. 67 of 78 compaction
     boundaries fire at a `preTokens` median of 467,446 and none between
     500k and 900k, so the natural experiment's intervention sits BELOW the
     question. The auto-compact threshold is roughly 467k; the reported
     knee is roughly 600k.
  2. MODEL MIX IS NOT CONSTANT ACROSS BANDS, and within-model trends
     disagree in DIRECTION. One model steps up across 300k to 400k while
     another falls, both with non-overlapping intervals. A flat pooled
     series is what two opposing series produce. This applies retroactively
     to SP1's pooled table.
  3. THE CENSORING HAZARD IS NOT COMPUTABLE as specified: 0 of 415
     main-thread transcripts carry a terminal `result` record.

  Survivorship is also worse than the brief predicted, and for a reason the
  brief did not have: the high-occupancy population is selected on
  CONFIGURATION, not only on outcome, since a session only passes 500k if
  it did not auto-compact at 467k. That is a change of population, not a
  bias of degree. So flat-or-falling rework above 600k is NOT evidence
  against the knee, and the dominated region still must not be built into
  a default. Also ruled out along the way: `file-history-delta` is not a
  revert oracle (no content digest, 7 percent file coverage).

  THE HANDOFF ARTIFACT IS NOW DESIGNED, AND THE COST MATH ARGUES FOR IT
  (`probe-shift-handoff-artifact.md`, aae-orc-7opc). Writing a handoff at
  the p50 pressure point costs about $0.125, of which 92 percent is the
  predecessor re-reading its own context, so asking for one costs roughly
  one ordinary turn. Reading a 2k-token artifact is 2.6 percent of the
  measured cold re-warm. Break-even is five successor turns at 95k
  occupancy and ONE turn at the occupancy where shifts actually fire.

  The liability is the grace window, not the tokens: three roles each
  burning a 60s grace costs 210s, which loses to the 154s compaction by an
  order. So handoff defaults off, and an unresponsive predecessor
  short-circuits at one tick rather than waiting out the grace. Gate S0
  (does any harness expose an event at which a departing agent can be
  ASKED, and acknowledge, before its pane dies) is unanswered and blocks
  the whole arc; a "no" across all four harnesses is a real result that
  forces the involuntary path.

  Two results from that probe bear on this node directly. The stage-rig
  discipline RULES OUT the cheapest option: marvel already parses the
  session stream and could summarize it with no cooperation, no bus, and
  no cost at the pressure point, which F25 forbids on its own cited
  measurement. And `question-marvel-graceful-stop` asks for the same
  window under a different verb, so that should be one mechanism with two
  callers rather than two mechanisms.

  THE READINESS INSTANT IS NOW IN THE RING (marvel#159).
  `team.shift-role-ready` fires at the `allReady` verdict carrying
  workspace, team, role, successor generation, and the admitting gate, so
  the 50Hz poll finding-018 needed is no longer required to price
  launch-to-ready. Two limits an automatic trigger must respect: it stamps
  the control plane's OBSERVATION of readiness rather than the instant the
  successor became capable, so with a 2s ticker it is up to one tick late
  and finding-018's 1.09s first-heartbeat column stays unobservable from
  the ring; and `allReady` has exactly one caller, so scale-up and restart
  still produce no readiness signal at all (aae-orc-h8lp). Anything
  pricing time-to-useful today sees a shift-biased sample.

  SHIFTING IS NOT OBVIOUSLY THE CHEAP SIDE. Compaction is measured at
  154s median, up to 275s (finding-016). Standby tiers trade money for
  latency and marvel already owns the machinery (a hot standby is a
  replica that exists before it is scheduled, a reconciler question
  rather than a new subsystem). The comparison is four-way: token cost,
  wall-clock cost, standby carrying cost, and quality delta. Three are
  measurable with instruments already built; the fourth is what critic
  exists for. Tracked: aae-orc-56w0 (price the standby tiers).

  MEASURED 2026-08-08 (finding-018, aae-orc-r4q6), and the answer is
  split. The CONTROL PLANE is not the expensive side and the inversion
  suspected above does not happen there: a one-role shift completes in
  8.92s median (n=7, IQR 5ms), and the cost scales linearly at 7.99s
  per role across three role counts with residuals under 10ms. That is
  four reconcile ticks per role; roughly 88 percent of a one-role shift
  is waiting for the 2s ticker rather than doing work, which makes
  shift latency a tunable rather than a cost. The crossover with a 154s
  compaction sits near 19 roles.

  BUT THE COMPARISON IS NOT LIKE FOR LIKE, and this is the part that
  bears on triggers. A compaction preserves the working context,
  compressed. A marvel shift preserves nothing: finding-018 confirms in
  code that there is no drain (shiftDrain calls kill-pane on the
  predecessor with no signal-then-wait and no chance to finish a turn),
  and that no handoff artifact exists anywhere in the repository. The
  shift is fast partly BECAUSE it does not do the work a handoff
  implies. So whether a shift beats a compaction END TO END is still
  undetermined: it depends on how many turns a successor needs to
  rediscover its predecessor's working state, and that is unmeasurable
  while there is nothing for it to read. The handoff artifact is
  therefore the blocking measurement for this node's cost model, not a
  separate design nicety.

  THE COLD-SUCCESSOR PREMIUM IS PRICED, and it is money rather than
  time. Derived from five instrumented harness runs (finding-018):
  cache write costs 8.8x cache read per token, so a successor that must
  re-create 77.5k of 95.4k input tokens pays roughly 6.3x the run cost
  of a warm one. No wall-clock penalty for a cold cache was detectable
  at that sample size. Anyone arguing cache locality here should argue
  it in dollars.

  MARVEL EMITS NO READINESS EVENT. The instant the control plane
  decides a successor can take over is made inside allReady, between
  session.created and session.deleted, with nothing written to the
  event ring. finding-018 had to poll the session table at 50Hz to
  timestamp it. It is the boundary of the only stage that grows when
  real harnesses replace simulators, and it is the stage a trigger
  would need to reason about.

  A PER-SESSION ACTUATOR CAN REDUCE FLEET THROUGHPUT, which is the
  reason automatic triggers should not ship ahead of a fleet-level
  objective. Four mechanisms, all reachable with what marvel ships or
  plans: correlated shifts burst a shared limit; high occupancy makes
  occupancy a per-fleet CONCURRENCY limit rather than only a per-
  session cost; cache locality is a fleet property being managed per
  session; coordination overhead grows with fleet size rather than
  fleet output. Tracked: aae-orc-hfc0.

  THE COMPACTION SIGNAL A TRIGGER WOULD CONSUME IS MEASURED NOW
  (finding-024, 2026-08-09), and the detector half is sound while the
  input half is not. Replayed against 63 labelled Claude compactions,
  the shipped hysteresis fired 63 times with zero false negatives and a
  minimum margin of 4.03x, so the reasoned constants are calibrated.
  The trigger cannot rely on that yet, for three separate reasons all
  pointing the same way, toward reporting LOW pressure at HIGH
  pressure:

  1. 19 of 82 boundaries produce no post-boundary sample in marvel's
     series, so the detector cannot fire on them at all.
  2. The primary-model latch freezes the reading. 19 sessions switch
     model permanently; from that point the sink is never written and
     the stored CTX% stays at its pre-switch value, worst case 79,246
     against a session that reached 751,169. A trigger armed on a level
     that has stopped moving never fires and looks correctly
     configured, which is the same failure shape finding-016 named for
     the wrong denominator.
  3. "Compaction detected" is not "compaction happened." Two real
     context drops of 16-20 percent carry no compaction record, and one
     detection fired on a zero-occupancy record rather than on a
     post-compaction level. Any trigger keyed on the compaction COUNT
     inherits all three.

  A READING NEEDS AN AGE, and this is the cheapest of the three fixes.
  `api.SessionContext` carries no observation time, so neither the
  frozen latch nor a session idle since yesterday (where the level
  marvel holds bears no relation to the harness's own count, measured
  0.14x to 18.6x across a resume gap) is distinguishable from a fresh
  reading by an operator or by a gate.
