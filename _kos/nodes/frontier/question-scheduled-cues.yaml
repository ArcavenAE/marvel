id: question-scheduled-cues
type: question
confidence: frontier
title: "Should marvel cue recurring work on a clock, and alarm when a recurring job has not run within its bound?"
tags:
  - marvel
  - scheduling
  - observability
content: |
  Raised by another team's harvest, 2026-09-27 (distribution manifest
  row 16). Recurring sweeps in that fleet had no clock of their own. Each
  one ran because a supervisor seat set a background sleep timer, then
  routed the work and nudged the pane. When the supervisor skipped the
  timer while waiting on a restart, no sweep ran for about 19 hours, and
  nobody was told a gap existed until the next sweep ran. Nothing was lost
  that time, because the next sweep's search window covered the gap; the
  items that closed inside it were still unobserved.

  marvel today has no scheduled work. The Schedule resource (the CronJob
  row in elem-k8s-resource-model) is model-only: no type, no code, no CLI.

  Open:
  - Does marvel own the clock (a declared schedule that delivers a cue to
    a role on a cadence), or only the freshness alarm (an event when a
    declared recurring job has not reported within its bound), leaving
    the cue to director?
  - What does a cue deliver into an interactive seat, given that a pane
    inject is not a dispatch channel (finding-040) and an interactive
    seat takes no first prompt today (finding-055, marvel#391)?
  - Where does "last ran" live so the alarm survives a daemon restart?

  An alarm alone would have surfaced the 19-hour gap. It is the smaller
  first piece, and it fits marvel's diagnostic-not-gate posture: an event,
  never a block.

  HARVEST 2026-10-09.

  finding-060 (scheduled runs S-2, marvel#431): the control and management
  plane is not a redaction boundary. Describe shows a run's result text to the
  operator (operator ruling); what is never forwarded off the control plane is
  the result text. Named defaults put a design gap where someone can rule on
  it.

  BUILT, marvel#650 (S-3, merged 9e47465a): the schedule clock. Its named
  defaults, with rulings from the operator on 2026-10-07 relayed by director:
  1. the clock runs on the reconcile tick (2 s), so a firing can start up to
     one tick late (answered from the code);
  2. an unset `starting_deadline` is a one-minute grace for the first start
     only; retries are bounded by `retries` alone (ruled);
  3. a firing is skipped while the team's posture is hold, and the money
     guard is never bypassed (ruled A);
  4. wildcard spring-gap firings coalesce at the first instant after the gap
     (accepted for now);
  5. to 8. a cancelled run settles its firing; retry backoff 30 s doubling to
     5 m; a new firing deletes the earlier firing's finished session rows;
     suspend catches nothing up (adopted).

  KNOWN LIMIT (marvel#650): on tmux before 3.5 a dead pane's exit status can be
  lost, so an exit-0 scheduled run can be recorded failed and spend a retry,
  or freeze the schedule under `on_failure = freeze`. Not fixed; tests follow
  the tmux version gate. See elem-tmux-session-substrate.
