id: question-stream-attachment
type: question
confidence: frontier
title: "Which stream-attachment strategy does each runtime adapter use for observing agent output?"
tags:
  - marvel
  - streaming
  - observability
content: |
  How does marvel observe agent output? Four strategies with
  different tradeoffs:

  - **PTY-owned** — marvel owns the pty. Conflicts with the tmux
    substrate (`elem-tmux-session-substrate`). Likely ruled out
    because the substrate is bedrock.
  - **pipe-pane to FIFO** — tmux `pipe-pane` to a named pipe.
    Pragmatic. Works with any tmux session.
  - **cooperative socket from forestage** — highest structure,
    marvel-aware-only. Forestage opens a Unix socket marvel can
    connect to and consume structured NDJSON. Best for the deep
    forestage adapter.
  - **periodic `capture-pane` scrape** — lowest fidelity. Polls
    tmux for pane contents at an interval. Universal BYOA fallback
    for runtimes that aren't marvel-aware (the `generic` adapter).

  Runtime adapter selects strategy based on runtime capabilities.
  Forestage = cooperative socket; bare-claude = pipe-pane;
  generic = capture-pane scrape.

  Needs a probe. Tracked: `aae-orc-3cp` (P2). Performance under
  load is the open question — capture-pane at 1Hz vs 10Hz vs
  event-driven; pipe-pane buffering; cooperative socket
  reconnection.

  REOPEN 2026-07-31 (evidence-based, not a preference reversal).
  Two premises of the strategy list above have been invalidated:

  1. The PTY-owned rule-out was circular. It rested on
     `elem-tmux-session-substrate` being bedrock; finding-045
     classifies B2 as a probe CONTROL retroactively collapsed into
     bedrock, and aae-orc-kxce (promoted 2026-07-31) now carries the
     substrate decision with PTY-owned and shim-in-pane restored to
     the candidate set (spike: aae-orc-e35c).
  2. The cooperative-socket strategy's only named implementation was
     forestage, and it never existed: forestage contains no heartbeat
     or marvel-socket code (the CTX% producer has always been the
     simulator). Forestage is retiring per the 2026-07-31 operator
     directive (`_kos/ideas/forestage-retirement-harness-first.md`
     at orc level); harness-first targets are Claude Code, Codex,
     Gemini CLI, Crush, OpenCode.

  aae-orc-3cp is re-scoped as the decision probe: per-harness
  telemetry-surface inventory plus byte-path fidelity measurement
  (FIFO redirect vs shim PTY tee vs capture-pane). The per-runtime
  binding reframe finding-048 ordered (question named there as
  question-marvel-stream-attachment-binding, never filed) lands here
  instead of as a separate node.

  Evidence: finding-005 (this repo) ran the re-scoped probe — per-harness
  inventory plus byte-path fidelity (FIFO and pipe-pane both lossless at
  100%, capture-pane loss follows `visible_rows * poll_hz`), and confirmed
  none of marvel's target harnesses requires marvel to own the PTY, so the
  attachment path does not constrain the substrate. finding-004 (shim-in-pane
  spike, on spike/shim-in-pane) filled the shim-PTY-tee row that finding-005
  left blank. Both are addressed to the substrate decision aae-orc-kxce.

  DIRECTION SETTLED 2026-07-31 (aae-orc-kxce ratified; decision brief
  `_kos/probes/decision-brief-kxce-substrate.md`). Per-harness attachment
  bindings: Claude Code / Codex / OpenCode structured stream over FIFO;
  Crush FIFO text + sqlite for tokens pending a socket probe; Gemini CLI
  structured stream over FIFO, gated on re-verifying #9009/#13561;
  unknown/non-cooperative harness capture-pane history scrape with a
  high-water mark; adopted session pipe-pane. This node stays frontier
  because the bindings for Codex/OpenCode/Crush are not yet exercised
  against live model turns and Gemini is graph-only; the DIRECTION is
  fixed, per-harness VERIFICATION remains. Cursor is out of scope
  (SpaceX acquisition; not a target harness).

  CONTEXT-PRESSURE PRODUCER GAP 2026-08-01 (finding-006). The three-act
  demo verification showed the attachment path carries bytes but does
  not yet DERIVE context pressure (CTX%) from them for the real
  harnesses. The single CTX% producer is the heartbeat RPC, so the
  column renders absent for claude/codex/opencode even though usage
  data is present in each harness's own stream (Claude Code stream-json
  usage; codex/opencode JSON usage). The simulator populates CTX%
  precisely because it is the one image that sends the heartbeat, which
  isolates the gap to a missing per-adapter producer, not missing
  plumbing. Extracting CTX% from the parsed adapter stream is the
  Lens-1 harness-first requirement; tracked as `aae-orc-w5su`
  (scope:cross-cutting), folded into this arc. Codex/OpenCode
  agent-stream token/usage events were observed live during the demo
  (Act 2), which closes part of the "live model turns" verification the
  DIRECTION-SETTLED note left open.

  CONTEXT-PRESSURE PRODUCER HALF RESOLVED 2026-08-01 (finding-007).
  The probe `probe-context-pressure-extraction` (aae-orc-frkq) ran on
  kinu against live claude/codex/opencode turns plus marvel's shipped
  FIFO path. CTX% is reconstructable from each cooperative harness's
  own structured stream without owning the PTY, so the shim
  (finding-004, aae-orc-gtpz) is NOT required for context pressure.
  Per-harness occupancy proxy (SP1): Claude Code = usage.input_tokens +
  cache_read_input_tokens + cache_creation_input_tokens (input_tokens
  ALONE understates the context ~3000x when cached, measured), with the
  limit declared in-stream at modelUsage.<model>.contextWindow (no table
  needed); Codex = turn.completed.usage.input_tokens (already includes
  cached as a subset), limit only in the rollout file
  (model_context_window) so marvel carries a model->limit table keyed on
  the launch -m arg; OpenCode = step_finish.part.tokens.input (+cache),
  limit from a table. Codex rate_limits.used_percent is a plan-budget
  quantity, NOT context occupancy. Seam (SP3): one shared
  usage-accountant fed by the events ring, owning the model->limit table
  and downward-step compaction detection, NOT per-adapter parser logic,
  because occupancy is stateful and the parsers are stateless per-line
  emitters. Ground truth (SP4): Claude Code's own context % uses the same
  numerator (the full cached-inclusive prompt) and denominator
  (contextWindow), so marvel's raw-occupancy proxy agrees by
  construction; Claude Code's DISPLAYED "% until auto-compact" is
  normalized to a configurable threshold plus a reserved buffer and reads
  higher than raw occupancy. Unblocks aae-orc-w5su with the derivation
  fixed. Still frontier: no live compaction crossing was measured (cost
  discipline), OpenCode cache-inclusion for a caching model is unverified,
  and Codex/OpenCode multi-turn accumulation is untested. See finding-007.

  THIRD CHANNEL UNDER INVESTIGATION 2026-08-01 (finding-008, aae-orc-mki1).
  Native harness telemetry (OpenTelemetry) is a third observation channel,
  orthogonal to the FIFO stream and capture-pane because it is emitted by
  the harness itself regardless of what owns the terminal, so it flows in
  BOTH headless and interactive/TUI sessions. Claude Code 2.1.220 OTEL is
  live-verified on kinu (CLAUDE_CODE_ENABLE_TELEMETRY=1 + standard OTEL env;
  metrics session.count/token.usage/cost.usage/active_time.total; events
  api_request/user_prompt/tool_result/tool_decision/api_error carrying the
  per-request token classes; session.id resource attribution). Codex 0.146.0
  ([otel] config.toml, otlp-http/grpc, conversation_starts log carries the
  context_window LIMIT) and Gemini CLI (--telemetry, OTLP) also emit OTEL
  natively (docs-cited). opencode removed its OTEL exporter (sst#1738) and
  Crush ships PostHog only, so neither is viable. Load-bearing negative: NO
  harness exports context-window occupancy or a percentage; all export token
  counts, so marvel still runs the finding-007 accountant. Native telemetry
  RE-SCOPES aae-orc-w5su (changes the feed, not the derivation) and gives
  aae-orc-dc1j its first clean interactive-CTX% path (retires capture-pane
  scraping for the three OTEL-capable harnesses) without fully closing it.
  No harness exposes a Prometheus scrape endpoint; delivery is OTLP push.
  Marvel is currently an OTEL producer (internal/otel/metrics.go stdout
  exporter + marvel.agent.context_window_percent gauge), not a receiver;
  consuming this channel needs one shared OTLP receiver with per-session
  correlation by session.id + injected marvel.agent_id resource attribute.
  Still frontier: only Claude was driven live for OTEL; Codex per-session
  env override and the Codex user-level-only config wrinkle are unverified;
  Gemini is graph-only. See finding-008.
