id: question-stream-attachment
type: question
confidence: frontier
title: "Which stream-attachment strategy does each runtime adapter use for observing agent output?"
tags:
  - marvel
  - streaming
  - observability
content: |
  How does marvel observe agent output? Four strategies with
  different tradeoffs:

  - **PTY-owned** — marvel owns the pty. Conflicts with the tmux
    substrate (`elem-tmux-session-substrate`). Likely ruled out
    because the substrate is bedrock.
  - **pipe-pane to FIFO** — tmux `pipe-pane` to a named pipe.
    Pragmatic. Works with any tmux session.
  - **cooperative socket from forestage** — highest structure,
    marvel-aware-only. Forestage opens a Unix socket marvel can
    connect to and consume structured NDJSON. Best for the deep
    forestage adapter.
  - **periodic `capture-pane` scrape** — lowest fidelity. Polls
    tmux for pane contents at an interval. Universal BYOA fallback
    for runtimes that aren't marvel-aware (the `generic` adapter).

  Runtime adapter selects strategy based on runtime capabilities.
  Forestage = cooperative socket; bare-claude = pipe-pane;
  generic = capture-pane scrape.

  Needs a probe. Tracked: `aae-orc-3cp` (P2). Performance under
  load is the open question — capture-pane at 1Hz vs 10Hz vs
  event-driven; pipe-pane buffering; cooperative socket
  reconnection.

  REOPEN 2026-07-31 (evidence-based, not a preference reversal).
  Two premises of the strategy list above have been invalidated:

  1. The PTY-owned rule-out was circular. It rested on
     `elem-tmux-session-substrate` being bedrock; finding-045
     classifies B2 as a probe CONTROL retroactively collapsed into
     bedrock, and aae-orc-kxce (promoted 2026-07-31) now carries the
     substrate decision with PTY-owned and shim-in-pane restored to
     the candidate set (spike: aae-orc-e35c).
  2. The cooperative-socket strategy's only named implementation was
     forestage, and it never existed: forestage contains no heartbeat
     or marvel-socket code (the CTX% producer has always been the
     simulator). Forestage is retiring per the 2026-07-31 operator
     directive (`_kos/ideas/forestage-retirement-harness-first.md`
     at orc level); harness-first targets are Claude Code, Codex,
     Gemini CLI, Crush, OpenCode.

  aae-orc-3cp is re-scoped as the decision probe: per-harness
  telemetry-surface inventory plus byte-path fidelity measurement
  (FIFO redirect vs shim PTY tee vs capture-pane). The per-runtime
  binding reframe finding-048 ordered (question named there as
  question-marvel-stream-attachment-binding, never filed) lands here
  instead of as a separate node.

  Evidence: finding-005 (this repo) ran the re-scoped probe — per-harness
  inventory plus byte-path fidelity (FIFO and pipe-pane both lossless at
  100%, capture-pane loss follows `visible_rows * poll_hz`), and confirmed
  none of marvel's target harnesses requires marvel to own the PTY, so the
  attachment path does not constrain the substrate. finding-004 (shim-in-pane
  spike, on spike/shim-in-pane) filled the shim-PTY-tee row that finding-005
  left blank. Both are addressed to the substrate decision aae-orc-kxce.

  DIRECTION SETTLED 2026-07-31 (aae-orc-kxce ratified; decision brief
  `_kos/probes/decision-brief-kxce-substrate.md`). Per-harness attachment
  bindings: Claude Code / Codex / OpenCode structured stream over FIFO;
  Crush FIFO text + sqlite for tokens pending a socket probe; Gemini CLI
  structured stream over FIFO, gated on re-verifying #9009/#13561;
  unknown/non-cooperative harness capture-pane history scrape with a
  high-water mark; adopted session pipe-pane. This node stays frontier
  because the bindings for Codex/OpenCode/Crush are not yet exercised
  against live model turns and Gemini is graph-only; the DIRECTION is
  fixed, per-harness VERIFICATION remains. Cursor is out of scope
  (SpaceX acquisition; not a target harness).
