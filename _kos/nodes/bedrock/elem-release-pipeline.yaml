id: elem-release-pipeline
type: element
confidence: bedrock
title: "release pipeline — gates + cross-platform builds + signing/notarization + tap + self-update + tier-1 guardrails"
content: |
  Full CI/release pipeline:

  - **Quality gate** — gofumpt, vet, golangci-lint, tests with race
    detector
  - **Cross-platform builds** — darwin arm64/amd64, linux
    amd64/arm64 (linux/arm64 added 2026-04-17, session-025,
    `aae-orc-803`; verified driving desk Pi remotely from kinu)
  - **Apple code signing + notarization** — app bundles, DMG, PKG
  - **Homebrew tap** — `ArcavenAE/tap/marvel` with arch-matrix
    branches
  - **Self-update** — `marvel upgrade` with Homebrew detection and
    `runtime.GOARCH` asset resolution
  - **Channels** — alpha releases on push to main; stable releases
    on `v*` tags via GoReleaser

  **Tier-1 guardrails (session-025):**
  - Pinned `.golangci.yml`: errcheck, govet, ineffassign, staticcheck,
    unused, misspell, unconvert, unparam + gofumpt formatter
  - Lefthook: pre-commit (fmt/vet/lint) + pre-push (go test -race)
  - `.claude/rules/` (bash, git-commits, go, kos-commits) via
    `_index.md`
  - `.editorconfig`
  - Security workflows ported from forestage: codeql, dependency-review,
    scorecards, release-verify
  - SHA-pinned actions
  - step-security harden-runner

  Evidence: session-017 (initial), session-025 (tier-1 + linux/arm64).
