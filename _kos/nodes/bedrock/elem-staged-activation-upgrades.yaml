id: elem-staged-activation-upgrades
type: element
confidence: bedrock
title: "staged-activation upgrades: bootstrap plane fetches and stages, cluster plane activates"
content: |
  Marvel upgrades separate fetch from activation across two planes.

  1. **Bootstrap/image plane** (mise/brew now; sideshow later):
     install first time, pre-stage new versions into a version store.
     Always safe; never touches the running cluster.
  2. **Cluster plane** (`marvel update`): cluster-aware; pre-flight
     checks (deprecation/compat detection, a pluto-like function),
     activation of a staged version, migration, rollback. The shipped
     `daemon reexec` (PR #80) is the activation primitive, not the
     whole story.
  3. **Version store**: staged versions coexist, flagged
     active-vs-present (the Nokia/Checkpoint firmware model; which
     version is staged and which runs are separate facts owned by
     different planes).

  Reshapes roadmap M3(d) from "self-update exists, shim makes it
  safe" into this two-plane model; reconciles obsolescence-review
  RETIRE-5 (distribution belongs to the channel; activation belongs
  to marvel). Zero-downtime upgrade is the long-term acceptance
  test. Design study precedes implementation (bd aae-orc-k28s
  carries it); version-store layout, decidable pre-flight checks,
  and rollback-with-live-agents semantics are open design questions
  recorded in the idea file.

  Operator-ratified 2026-08-01 (marvel remap governance interview,
  round 2; orc docs/marvel-remap-2026-08.md section 4). Near-verbatim
  capture: orc `_kos/ideas/marvel-staged-activation-upgrades.md`.

  ACTIVATION PRIMITIVE EXECUTED 2026-09-17 (finding-042). `daemon
  reexec` ran against a live daemon (pid 82578) supervising 18 agent
  panes on f601b6e: `syscall.Exec` replaced the process image in place
  with the pid preserved, all 18 panes adopted, 0 orphaned, HEALTH
  lagged one heartbeat and settled. And the "is it safe with a deleted
  old keg" question is answered: `selfExecPath` (daemon.go:594) resolves
  through `os.Executable()`, which on macOS returns the brew symlink
  (the invocation path), not the keg target, and `cleanExecPath` only
  trims the Linux `" (deleted)"` suffix. brew repoints the symlink at
  the new keg before reexec runs, so a deleted old keg does not strand
  it. reexec does not reopen finding-041 (keychain-capable session at
  start): it is the same pid, so the session stays keychain-capable.

  RUNNING VERSION HAS NO INSTRUMENT (finding-061, 2026-10-02). Point 3
  needs "which version runs" as a fact, and today nothing reports it:
  `marvel version` prints the client binary, the daemon's startup log
  names no version or revision, and no RPC returns one. After an upgrade
  without a reexec, installed and running differ silently. A daemon
  build field (log line plus status RPC) is a precondition of the
  version store's active-vs-present flag.

  MEASURED AGAINST TODAY'S CODE (finding-062, 2026-10-03). The study
  `_kos/probes/brief-marvel-upgrade-intelligence.md` read `marvel
  upgrade` at bc327df: one plane, not two (fetch, replace and activate
  in one step, and the direct path deletes the prior binary); failure
  reported as success on the brew and package paths; nothing verified
  before activation; agent continuity across reexec already present,
  control-plane recovery absent. It answers the open questions above
  and orders ten candidate PRs, the first three against filed issues
  (#485, #486, finding-061). The two-plane model stands; this node is
  unchanged except for this pointer.

  RUNNING BUILD NOW REPORTED (marvel#500, #510, 2026-10-03). The daemon
  reports its build and `marvel version` shows it beside the client's,
  answering the gap finding-061 named. One possible trap shaped it: that
  Go's VCS stamping walks past a linked worktree's `.git` FILE to an
  enclosing repository, so a build made in a worktree is stamped with the
  wrong repository's revision. Its author observed this once (#500); review
  did not reproduce it (5398542318 on go 1.27.0, again in #510's 5398696555).
  The guard is kept because it can only withhold a commit, never show a
  wrong one: marvel shows a commit only when the version string's trailing
  sha confirms it, and any other stamped revision as "unconfirmed"
  (`internal/daemon/build.go`). `vcs.modified`
  also counts untracked files, so a "dirty" mark can mean untracked files
  alone.

  READ-ONLY OPEN OF A LIVE STORE (finding-062's review note, sharpened;
  #496 review 5398475889, bbolt v1.5.0). A ReadOnly bbolt Open takes a
  shared flock with non-blocking retries every 50ms. Against a running
  daemon's exclusive lock, Timeout 0 (bbolt's default) blocks forever and
  Timeout N returns ErrTimeout after N; reexec frees the lock only inside
  Detach(). So a staged binary must be handed the store's facts or a
  snapshot, and any read-only open must set a timeout.

  THE KEG PATH ON LINUX (#498 review 5398478335). The finding-042 result
  above, that a deleted old keg does not strand reexec, holds on macOS
  only. There `os.Executable()` returns the path as invoked, symlink kept,
  so brew's retargeted link is followed. On Linux it returns
  Readlink("/proc/self/exe"), the fully resolved `Cellar/marvel/<old>/...`
  path, which never retargets, and `brew upgrade` runs `brew cleanup` unless
  HOMEBREW_NO_INSTALL_CLEANUP is set. #498 fixed the upgrade's change
  fingerprint for this. Whether reexec's own `selfExecPath` on a Linux brew
  host lands on the new keg is not checked here.

  STATE 2026-10-04 (harvest, finding-065). Under mise, `marvel daemon reexec`
  restarts the OLD binary: mise keeps each version in its own directory, the
  daemon's own path still points at the old one, and `selfExecPath` resolves
  that path, while the version text says reexec adopts the installed binary
  (marvel#523, open, at e979fc2). The measured way through is `stop
  --keep-bus` and a fresh daemon from the new path (4 sessions adopted);
  marvel#525 documents it. This narrows the finding-042 claim further: reexec
  is an in-place activation, not a way onto a new mise version. Related
  signals that disagree with what happened or say nothing: the v1 to v2 store
  migration logs neither that it ran nor where the backup is (marvel#524),
  and a running daemon answers from its start-time config (marvel#514).
  Closed: marvel#485, #486, #497. Wire rule from marvel#510, which added the
  daemon build report: a released client reads only the fields it knew, so a
  field's meaning never changes on the wire; new meaning gets a new additive
  field, tested by decoding the new JSON with the old client's struct.

