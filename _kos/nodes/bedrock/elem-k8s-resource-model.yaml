id: elem-k8s-resource-model
type: element
confidence: bedrock
title: "kubernetes-inspired resource model for agent workloads"
content: |
  Resource types map k8s concepts to agent orchestration:

  | Kubernetes | Marvel | Meaning |
  |---|---|---|
  | Namespace | Workspace | Isolation boundary |
  | Pod | Session | Atomic unit — one tmux pane running one BYOA console |
  | Container | Runtime | The BYOA console binary (forestage/claude/generic) |
  | Deployment | Team | Cohesive unit of heterogeneous roles |
  | (none) | Role | One kind of agent within a team |
  | Service | Endpoint | Stable name for an agent capability |
  | CronJob | Schedule | Timed agent tasks |
  | ConfigMap | Pack | Content packs (spectacle, bmad) mounted into sessions |
  | Secret | Vault | Auth delegation references |
  | PVC | Volume | Workspace storage |
  | Probe | Healthcheck / Readycheck | Liveness / readiness |
  | Ingress | Gateway | External access (switchboard / director / external) |
  | Node | Host | Machine running marvel |

  Manifests are TOML by default (YAML also supported per `elem-yaml-manifest-support`).
  Reconciliation loop drives desired → actual state convergence.

  Evidence: implemented and working in MVP. ADR: orc decisions/adr-003.
