id: elem-data-directory-permissions
type: element
confidence: bedrock
title: "~/.marvel/ data directory with OpenSSH-style permission enforcement"
content: |
  Canonical on-disk layout rooted at `~/.marvel/` (0700):

  | Path | Mode | What |
  |---|---|---|
  | `config.yaml` | 0600 | Cluster config (see `elem-cluster-configuration`) |
  | `authorized_keys` | 0600 | SSH-server authorized client keys |
  | `ssh_host_ed25519_key` | 0600/0644 | Daemon's SSH host key |
  | `known_hosts` | 0644 | Client TOFU records |
  | `keys/` | 0700 | Client key dir |
  | `keys/client_ed25519` | 0600/0644 | Default client key |
  | `log/` | 0700 | Log dir |
  | `log/daemon.log` | 0600 | Daemon log |
  | `run/` | 0700 | Runtime dir |
  | `run/daemon.pid` | 0644 | Pid file |

  The `internal/paths` package owns the layout. `EnsureHome` /
  `EnsureKeysDir` / `EnsureLogDir` / `EnsureRunDir` create dirs at
  0700. `Audit` / `Repair` enforce modes. `VerifyPrivateKeyMode`
  refuses to load a private key with weaker perms.

  **Daemon CLI (session-025):**
  - `--log-file PATH` tees stderr to a file (only when stderr is not
    a TTY, to avoid double-writes under `nohup ... 2>&1`)
  - `--pidfile PATH` writes pid on start with sshd-style "refuse if
    live" semantics, removes on clean stop
  - Both default to the canonical paths above; empty string disables

  Evidence: session-025. `aae-orc-ax8`, `aae-orc-9d6` closed.

  **Known incomplete (measured 2026-08-06).** The table above is the
  on-disk layout, not the daemon's whole namespace. Two runtime
  namespaces escape it and both are machine global: the control socket
  (`/tmp/marvel.sock`, hardcoded at `config.go:19` and `daemon.go:39`,
  never resolved through `internal/paths`) and the tmux session prefix
  (`marvel-*` on the shared tmux server). Neither appears above.

  This has a direct consequence for the `--pidfile` guard described in
  this node. Its refuse-if-live semantics are real and on by default,
  but the pid file is HOME scoped while the socket is machine global,
  so the guard cannot protect the socket. Two daemons under different
  HOMEs collide with no warning. Moving the socket into this layout is
  what would make the guard load-bearing for it.

  Open at `question-daemon-isolation-boundary`.
