id: elem-cluster-configuration
type: element
confidence: bedrock
title: "cluster configuration — kubeconfig-style ~/.marvel/config.yaml with named clusters"
content: |
  Kubeconfig-style cluster config at `~/.marvel/config.yaml`. Named
  clusters with socket or server address. Resolution order:
  `--socket > --cluster > current_cluster > local default`.

  Commands:
  - `marvel config add-cluster` — register a new cluster (mrvl://host
    auto-attaches a default client key per
    `elem-mrvl-protocol-ssh`)
  - `marvel config use-cluster <name>` — switch current
  - `marvel config list` — inventory
  - `marvel config current` — show active

  The model mirrors kubectl's kubeconfig deliberately — operators
  familiar with k8s find the surface predictable. One operator can
  switch between local-mode and a remote daemon without juggling
  flags on every invocation.

  Evidence: session-017.
