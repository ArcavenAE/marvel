id: elem-mvp-complete
type: element
confidence: bedrock
title: "marvel MVP complete — resource types + tmux driver + reconciler + daemon + CLI + simulator"
content: |
  The minimum viable control plane is shipped:

  - **Resource types** — Workspace, Session, Runtime, Team, Endpoint,
    Pack, Host (`elem-k8s-resource-model`)
  - **tmux driver** — substrate adapter (`elem-tmux-session-substrate`)
  - **Session manager** — lifecycle (pending → running → done)
  - **Team reconciler** — per-role replica convergence
  - **Daemon** — long-running supervisor with mrvl:// RPC server
  - **CLI** — `marvel work`, `marvel get`, `marvel scale`,
    `marvel shift`, `marvel daemon`
  - **Simulator** — context-pressure monitoring + Lua supervisor
    scripting for testing without live agents

  Single-host, in-memory state. Persistence is open
  (`question-persistence`). Multi-host is open (`question-multi-host`).

  Evidence: marvel-mvp-probe (orc `sprint/rd/`), 2 probe cycles
  complete.
