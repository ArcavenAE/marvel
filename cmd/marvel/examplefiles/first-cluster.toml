# Marvel example: the first cluster. One supervisor and one worker, each with a
# plain prompt, so a first user applies one file and gets two seats on any host
# with no edits. The live lines hold no path; the commented launcher line names
# one under $HOME, for you to keep or change.
#
# It runs on the simulator, so it needs no model login and costs nothing. Needs
# marvel and marvel-simulator on PATH: an install gives both, and from a source
# build run  export PATH="$PWD/bin:$PATH"  first.
#
# The message bus is not part of a manifest. It is a cluster Services entry in
# your client config (config.yaml under your marvel home). To have marvel start
# and supervise a local broker, put this in config.yaml (nats-server must be on
# PATH):
#
#   clusters:
#     - name: local
#       services:
#         - name: bus
#           class: message-bus
#           provider: nats-server
#           mode: managed
#           listen: 127.0.0.1:4222
#   current_cluster: local
#
# A managed broker needs an explicit listen address; pick any free port. See
# docs/admin-guide.md for what the entry does and its other modes.
#
# Get:  marvel example first-cluster > first-cluster.toml   (in a source tree the file is examples/first-cluster.toml)
# Run:  marvel daemon &   then   marvel work first-cluster.toml
# See:  marvel get sessions
# Stop: marvel stop --teardown
#
# To use a real harness later, follow the commented lines in each role: the
# supervisor takes mail (--receiver), the worker does not. The swap replaces
# image, command and args and deletes the role's healthcheck block; nothing else
# changes, and the prompts stay.

[workspace]
name = "first-cluster"

[[team]]
name = "crew"

  [[team.role]]
  name = "supervisor"
  replicas = 1

    [team.role.runtime]
    image = "simulator"
    command = "marvel-simulator"
    args = ["--tick", "2000"]
    prompt = "You supervise the crew. Check in with the worker and report what it says."
    # To run a real harness, replace the image, command and args lines above
    # with these (director-session is the director launcher, installed with
    # director-mcp), and delete this role's healthcheck block, which is the
    # simulator's heartbeat check:
    #   image = "claude"
    #   command = "${DIRECTOR_HOME:-$HOME/.director}/bin/director-session"
    #   args = ["--marvel-role", "--receiver"]

    [team.role.healthcheck]
    type = "heartbeat"
    timeout = "10s"
    failure_threshold = 3

  [[team.role]]
  name = "worker"
  replicas = 1

    [team.role.runtime]
    image = "simulator"
    command = "marvel-simulator"
    args = ["--tick", "1000"]
    prompt = "You are the worker. Answer the supervisor when it checks in."
    # To run a real harness, replace the image, command and args lines above
    # with these (director-session is the director launcher, installed with
    # director-mcp), and delete this role's healthcheck block, which is the
    # simulator's heartbeat check:
    #   image = "claude"
    #   command = "${DIRECTOR_HOME:-$HOME/.director}/bin/director-session"
    #   args = ["--marvel-role"]

    [team.role.healthcheck]
    type = "heartbeat"
    timeout = "10s"
    failure_threshold = 3
