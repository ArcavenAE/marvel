# Marvel example: handoff-first shift on context pressure (the remainder trigger).
#
# This role asks its seat for a handoff before its context occupancy forces
# Claude Code to auto-compact, and shifts only when the seat writes it. The
# trigger is a token REMAINDER, not a percentage: when a live session rises
# within headroom_tokens of its resolved window (context_tokens > context_limit
# - headroom_tokens), marvel tells the seat to write its handoff to the declared
# file, and starts the shift when that file ends in handoff_marker. With no
# marker by the end of the window, marvel reports shift-handoff-missing and
# leaves the seat running: no handoff is worse than autocompaction (operator
# ruling, 2026-10-04), so a context-pressure condition without the handoff and
# handoff_marker pair is refused at apply.
#
# Firing on the level, not on a post-compaction event, is what lets the handoff
# finish BEFORE the harness compacts; the event would arrive one compaction too
# late (orc finding-016). Set headroom_tokens above the cost of writing the
# handoff and of a clean shift.
#
# Scope: a resolved window is the denominator, not the whole trigger. This role
# pins the 1M Claude window via runtime.context_window so context_limit is
# explicit (a claude [1m] session resolves 1000000 from the model table on its
# own). But the numerator, context_tokens, is only read for a session marvel has
# an activity channel for: a headless stream, or the statusline feed. This is an
# interactive claude, which emits no parseable stream, so it also declares
# context_feed: statusline; without it the reading stays 0 and the trigger never
# arms (orc finding-044). codex and opencode declare no window and stay
# operator-shifted unless given one.
#
# Setup:
#   just build
#   ./bin/marvel daemon &
#   ./bin/marvel work examples/auto-shift.yaml
#
# Observe:
#   ./bin/marvel events   # team.shift-handoff-requested names the session asked;
#                         # team.shift-autotriggered and team.shift-started follow
#                         # once the handoff file ends in the marker

workspace:
  name: long-run

teams:
  - name: researcher
    roles:
      - name: worker
        replicas: 1
        permissions: plan
        runtime:
          image: claude
          command: claude
          context_window: 1000000
          context_feed: statusline
        shift:
          on: context-pressure
          headroom_tokens: 120000
          handoff: ~/handoffs/{session}.md
          handoff_marker: END HANDOFF
