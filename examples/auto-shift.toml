# Marvel example — automatic shift on context pressure (the remainder trigger).
#
# This role shifts itself before its context occupancy forces Claude Code to
# auto-compact. The trigger is a token REMAINDER, not a percentage: marvel
# initiates a shift when a live session rises within headroom_tokens of its
# resolved window (context_tokens > context_limit - headroom_tokens).
#
# Firing on the level, not on a post-compaction event, is what lets the shift
# finish BEFORE the harness compacts; the event would arrive one compaction too
# late (orc finding-016). Set headroom_tokens above the cost of a clean shift.
#
# Scope: a resolved window is the denominator, not the whole trigger. This role
# pins the 1M Claude window via runtime.context_window so context_limit is
# explicit (a claude [1m] session resolves 1_000_000 from the model table on its
# own). But the numerator, context_tokens, is only read for a session marvel has
# an activity channel for: a headless stream, or the statusline feed. This is an
# interactive claude, which emits no parseable stream, so it also declares
# context_feed = "statusline"; without it the reading stays 0 and the trigger
# never arms (orc finding-044). codex and opencode declare no window and stay
# operator-shifted unless given one.
#
# Setup:
#   just build
#   ./bin/marvel daemon &
#   ./bin/marvel work examples/auto-shift.toml
#
# Observe:
#   ./bin/marvel events   # team.shift-autotriggered names the deciding session,
#                         # then team.shift-started for the same shift

[workspace]
name = "long-run"

[[team]]
name = "researcher"

  [[team.role]]
  name = "worker"
  replicas = 1
  permissions = "plan"

    [team.role.runtime]
    image = "claude"
    command = "claude"
    context_window = 1000000
    context_feed = "statusline"

    [team.role.shift]
    on = "context-pressure"
    headroom_tokens = 120000
