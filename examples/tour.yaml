# Marvel example: the tour. A team of three workers and one supervisor on the
# simulator, so it needs no model login and costs nothing. See docs/tour.md.
# Needs marvel and marvel-simulator on PATH: an install gives both, and from a
# source build run  export PATH="$PWD/bin:$PATH"  first.
# Run:  marvel daemon &   then   marvel work examples/tour.yaml
# Stop: marvel stop --teardown

workspace:
  name: demo

teams:
  - name: crew
    roles:
      - name: worker
        replicas: 3
        runtime:
          image: simulator
          command: marvel-simulator
          args: ["--tick", "1000"]
        healthcheck:
          type: heartbeat
          timeout: "10s"
          failure_threshold: 3

      - name: supervisor
        replicas: 1
        runtime:
          image: simulator
          command: marvel-simulator
          args: ["--tick", "2000"]
        healthcheck:
          type: heartbeat
          timeout: "10s"
          failure_threshold: 3
